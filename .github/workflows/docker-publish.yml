name: Build & Push Docker Image

# Builds the image that is actually shipped — magpeek/coremail-app from
# infra/docker/Dockerfile.app (all services + both frontends) — for amd64 and
# arm64, with SLSA provenance (mode=max) and an SBOM attached as attestations,
# and signs the pushed digest with cosign (keyless, GitHub OIDC).
#
# Verify a release:
#   cosign verify docker.io/magpeek/coremail-app:<tag> \
#     --certificate-identity-regexp '^https://github.com/MAGPEEK/CoreMail/\.github/workflows/docker-publish\.yml@refs/(heads/main|tags/v.*)$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   docker buildx imagetools inspect docker.io/magpeek/coremail-app:<tag> --format '{{ json .Provenance }}'
#
# Actions are pinned by commit SHA (tag in the comment) — update them deliberately.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# Nothing by default; the job below asks for exactly what it needs.
permissions: {}

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: docker.io
  IMAGE: magpeek/coremail-app

jobs:
  build:
    name: Build coremail-app
    runs-on: ubuntu-latest
    # The monolithic image (Node services + two Vite frontends) under QEMU for
    # arm64 takes considerably longer than the old per-service images. Without
    # a timeout a hung QEMU build would run until the GitHub default (6 h).
    timeout-minutes: 120
    permissions:
      contents: read    # checkout
      id-token: write   # cosign keyless signing (Fulcio certificate via GitHub OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # Git tag v1.2.3 → 1.2.3 + 1.2 + 1 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main branch → edge
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            # SHA for traceability
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=CoreMail
            org.opencontainers.image.description=CoreMail — open-source mail server (SMTP/IMAP/POP3/JMAP/ActiveSync/CalDAV, webmail, admin panel)
            org.opencontainers.image.vendor=MAGPEEK
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.app
          # Pull requests push nothing and build amd64 only (the QEMU arm64
          # build is slow and has hung on PR runs). main and tags: amd64 + arm64.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain attestations stored with the image in the registry
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=coremail-app
          cache-to: type=gha,mode=max,scope=coremail-app

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          # Sign the manifest-list digest once — every tag points to it.
          cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
