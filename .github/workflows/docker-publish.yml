name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: magpeek/coremail

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: storage-api
            dockerfile: packages/storage/Dockerfile
          - service: auth-service
            dockerfile: packages/auth-service/Dockerfile
          - service: security-filter
            dockerfile: packages/security-filter/Dockerfile
          - service: smtp-server
            dockerfile: packages/smtp-server/Dockerfile
          - service: imap-server
            dockerfile: packages/imap-server/Dockerfile
          - service: pop3-server
            dockerfile: packages/pop3-server/Dockerfile
          - service: ews-server
            dockerfile: packages/ews-server/Dockerfile
          - service: autodiscover
            dockerfile: packages/autodiscover/Dockerfile
          - service: caldav-server
            dockerfile: packages/caldav-server/Dockerfile
          - service: api-gateway
            dockerfile: packages/api-gateway/Dockerfile
          - service: backup-service
            dockerfile: packages/backup-service/Dockerfile
          - service: web-client
            dockerfile: packages/web-client/Dockerfile
          - service: admin-panel
            dockerfile: packages/admin-panel/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            # Git-Tag v1.2.3 → 1.2.3 + 1.2 + 1 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main-Branch → edge
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            # SHA für Traceability
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=CoreMail ${{ matrix.service }}
            org.opencontainers.image.description=CoreMail — Open-Source Exchange 2019 Alternative
            org.opencontainers.image.vendor=MAGPEEK
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Zusammenfassungs-Job — schlägt fehl wenn irgendein Build fehlschlug
  publish-summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "::error::One or more Docker builds failed"
            exit 1
          fi
          echo "All Docker images built successfully"
