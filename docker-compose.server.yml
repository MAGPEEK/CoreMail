# ═══════════════════════════════════════════════════════════════════════════════
# CoreMail — docker-compose.server.yml
#
# Produktions-Deployment auf einem regulären Linux-Server.
# Alle persistenten Daten liegen in Docker-verwalteten Named Volumes —
# kein Bind-Mount auf Host-Verzeichnisse (außer TLS-Zertifikate).
#
# ── Schnellstart ────────────────────────────────────────────────────────────
#
#   # 1. Umgebungsdatei anlegen
#   cp .env.example .env && nano .env
#
#   # 2. TLS-Zertifikate ablegen (z.B. via Certbot)
#   mkdir -p /etc/coremail/certs
#   cp /etc/letsencrypt/live/mail.domain.de/fullchain.pem /etc/coremail/certs/
#   cp /etc/letsencrypt/live/mail.domain.de/privkey.pem   /etc/coremail/certs/
#
#   # 3. Stack starten
#   docker compose -f docker-compose.server.yml up -d
#
# ── Optionale Observability (Prometheus + Grafana + Loki + Tempo) ──────────
#
#   docker compose -f docker-compose.server.yml --profile observability up -d
#
# ── Volumes anzeigen ────────────────────────────────────────────────────────
#
#   docker volume ls | grep coremail
#
# ── Volumes sichern ─────────────────────────────────────────────────────────
#
#   docker run --rm -v coremail_pgdata:/data -v $(pwd):/backup alpine \
#     tar czf /backup/pgdata-$(date +%F).tar.gz -C /data .
#
# ═══════════════════════════════════════════════════════════════════════════════

name: coremail

services:

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  CoreMail App                                                           │
  # │                                                                         │
  # │  Enthält alle Dienste in einem Container:                               │
  # │    • SMTP (Port 25 / 465 / 587)                                        │
  # │    • IMAP (Port 143 / 993)                                              │
  # │    • POP3 (Port 110 / 995)                                              │
  # │    • EWS, ActiveSync, Autodiscover                                      │
  # │    • CalDAV / CardDAV                                                   │
  # │    • Webmail (OWA), Admin-Panel (ECP), REST API                        │
  # │    • Auth (lokal, LDAP, OIDC, MFA)                                     │
  # │    • Spam- & Virenschutz, Backup-Service                               │
  # └─────────────────────────────────────────────────────────────────────────┘

  coremail:
    image: magpeek/coremail-app:1.3.16
    container_name: coremail
    restart: unless-stopped

    environment:
      # ── Pflichtfelder ────────────────────────────────────────────────────────
      NODE_ENV: production
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}           # z.B. mail.meinedomain.de
      SMTP_HOSTNAME: ${MAIL_HOSTNAME}
      IMAP_HOSTNAME: ${MAIL_HOSTNAME}

      # ── Datenbank ────────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD}@postgres:5432/coremail
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # ── Objektspeicher (Anhänge + Backups) ──────────────────────────────────
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: mail-attachments

      # ── Sicherheit ───────────────────────────────────────────────────────────
      # Generieren: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET}
      PEPPER: ${PEPPER}

      # ── WebAuthn / FIDO2 ─────────────────────────────────────────────────────
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-CoreMail}
      WEBAUTHN_RP_ID: ${MAIL_HOSTNAME}
      WEBAUTHN_ORIGIN: https://${MAIL_HOSTNAME}

      # ── Backup ──────────────────────────────────────────────────────────────
      BACKUP_BUCKET: coremail-backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}       # tägl. 02:00 Uhr
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}  # 30 Tage

      # ── Logging ─────────────────────────────────────────────────────────────
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # ── GeoIP (optional) ─────────────────────────────────────────────────────
      # Account: https://www.maxmind.com/en/geolite2/signup
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}

    ports:
      # HTTP — Webmail / Admin-Panel / API / EWS / Autodiscover
      # HTTPS-Terminierung außerhalb (Traefik, Caddy, nginx, Let's Encrypt)
      - "3000:3000"

      # SMTP
      - "25:25"       # Eingehend (MX-Empfang) — STARTTLS
      - "465:465"     # Submission — Implizites TLS (SMTPS)
      - "587:587"     # Submission — STARTTLS

      # IMAP
      - "143:143"     # STARTTLS
      - "993:993"     # Implizites TLS (IMAPS)

      # POP3
      - "110:110"     # STARTTLS
      - "995:995"     # Implizites TLS (POP3S)

    volumes:
      # TLS-Zertifikate (einziger Bind-Mount — echte Certs vom Host)
      # Let's Encrypt: certbot certonly --standalone -d mail.meinedomain.de
      # Zertifikate unter /etc/coremail/certs/ ablegen (fullchain.pem + privkey.pem)
      - ${CERTS_PATH:-/etc/coremail/certs}:/app/certs:ro

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

    # ── Container-Hardening ──────────────────────────────────────────────────
    security_opt:
      - seccomp:unconfined    # Eigenes Seccomp-Profil in Prod ergänzbar

    cap_drop:
      - ALL                   # Alle Capabilities entfernen …

    cap_add:
      - NET_BIND_SERVICE      # … nur diese behalten:
      - SETUID                # Privilegierte Ports (SMTP 25, IMAP 143, POP3 110)
      - SETGID                # supervisord → setuid/setgid zu node-User
      - CHOWN
      - DAC_OVERRIDE
      - KILL                  # supervisord (root) → SIGTERM an node-User-Prozesse

    tmpfs:
      - /tmp:noexec,nosuid,size=256m

    # 12 Node.js-Services × ~10 Threads (libuv + V8 GC + Prisma-Tokio) = ~120 Threads
    # Plus Overhead → 500 als komfortabler Puffer
    pids_limit: 500

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    networks: [coremail]

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  PostgreSQL 16                                                          │
  # └─────────────────────────────────────────────────────────────────────────┘

  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: coremail
      POSTGRES_USER: coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Maximale Verbindungen (Standard: 100) — bei vielen Usern erhöhen
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-100}
      # Shared Buffers: ~25% des verfügbaren RAM (hier: 256 MB)
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-256MB}

    # Einzeilig — YAML-Folded-Scalar (>) würde bei tieferer Einrückung
    # Newlines erhalten → Shell würde jeden -c Flag als eigenen Befehl ausführen.
    command: "postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100} -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB} -c effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-768MB} -c wal_level=replica -c archive_mode=off -c log_min_duration_statement=1000 -c log_connections=off -c log_disconnections=off"

    volumes:
      # Named Volume — Docker verwaltet Speicherort auf dem Host
      # Standardpfad: /var/lib/docker/volumes/coremail_pgdata/_data/
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    pids_limit: 100

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    networks: [coremail]

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  Redis 7                                                                │
  # │  Sessions, SMTP-Queue, Greylisting, Live-Events (SSE)                  │
  # └─────────────────────────────────────────────────────────────────────────┘

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped

    # Direkt als redis-User starten (UID/GID 999 im offiziellen Image).
    # Das Entrypoint-Skript prüft `id -u`: ist es ≠ 0, überspringt es
    # setpriv/gosu komplett und führt redis-server direkt aus. So wird
    # der Privilege-Drop umgangen, der mit no-new-privileges kollidiert.
    user: "999:999"

    # Einzeilig — YAML-Folded-Scalar (>) würde bei tieferer Einrückung
    # Newlines erhalten statt falten → Shell würde jeden Flag als eigenen
    # Befehl ausführen → redis-server startet ohne Optionen oder crasht.
    command: "redis-server --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAX_MEMORY:-512mb} --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000 --loglevel notice"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
      # Keine cap_add nötig — kein setresuid/setpriv wenn als redis-User gestartet

    pids_limit: 50

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [coremail]

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  MinIO — S3-kompatibler Objektspeicher                                  │
  # │  Speichert Mail-Anhänge (> 256 KB) und Backup-Archive                  │
  # └─────────────────────────────────────────────────────────────────────────┘

  minio:
    image: minio/minio:latest
    container_name: coremail-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Prometheus-Metriken aktivieren (für Observability-Profil)
      MINIO_PROMETHEUS_AUTH_TYPE: public

    volumes:
      - miniodata:/data

    # MinIO-Konsole NICHT öffentlich exponieren — nur intern erreichbar.
    # Zugriff über SSH-Tunnel: ssh -L 9001:localhost:9001 user@server
    expose:
      - "9000"
      - "9001"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    pids_limit: 100

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks: [coremail]

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  Observability (optional)                                               │
  # │  Aktivieren: docker compose -f docker-compose.server.yml               │
  # │              --profile observability up -d                              │
  # │                                                                         │
  # │  Grafana:    http://localhost:3001  (admin / ${GRAFANA_ADMIN_PASSWORD}) │
  # │  Zugriff via SSH-Tunnel:                                                │
  # │    ssh -L 3001:localhost:3001 user@server                               │
  # └─────────────────────────────────────────────────────────────────────────┘

  prometheus:
    image: prom/prometheus:latest
    container_name: coremail-prometheus
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose: ["9090"]
    networks: [coremail]

  grafana:
    image: grafana/grafana:latest
    container_name: coremail-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # Nur lokal exponieren — Zugriff via SSH-Tunnel (ssh -L 3001:localhost:3001)
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks: [coremail]

  loki:
    image: grafana/loki:latest
    container_name: coremail-loki
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/tmp/loki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose: ["3100"]
    networks: [coremail]

  tempo:
    image: grafana/tempo:latest
    container_name: coremail-tempo
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose: ["3200"]
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────
# Named Volumes
#
# Docker verwaltet alle Volumes automatisch.
# Speicherort auf dem Host: /var/lib/docker/volumes/coremail_<name>/_data/
#
# Volumes anzeigen:     docker volume ls | grep coremail
# Volume inspizieren:   docker volume inspect coremail_pgdata
# Volume sichern:
#   docker run --rm \
#     -v coremail_pgdata:/data \
#     -v /backup:/backup \
#     alpine tar czf /backup/pgdata-$(date +%F).tar.gz -C /data .
#
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
    driver: local
    labels:
      com.coremail.service: postgres
      com.coremail.description: "PostgreSQL Daten — Benutzer, Mails, Kalender, Kontakte"

  redisdata:
    driver: local
    labels:
      com.coremail.service: redis
      com.coremail.description: "Redis Persistenz (AOF) — Sessions, Queues, Greylisting"

  miniodata:
    driver: local
    labels:
      com.coremail.service: minio
      com.coremail.description: "Objektspeicher — Anhänge und Backup-Archive"

  prometheus-data:
    driver: local
    labels:
      com.coremail.service: prometheus

  grafana-data:
    driver: local
    labels:
      com.coremail.service: grafana

  loki-data:
    driver: local
    labels:
      com.coremail.service: loki

  tempo-data:
    driver: local
    labels:
      com.coremail.service: tempo

# ─────────────────────────────────────────────────────────────────────────────
# Netzwerk
#
# Internes Bridge-Netzwerk — Container kommunizieren per Service-Name.
# Nur die explizit deklarierten Ports sind von außen erreichbar.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  coremail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
