name: coremail

# ─────────────────────────────────────────────────────────────────────────────
# CoreMail — Synology NAS / Container Manager
#
# Setup via SSH:
#   NAS_HOSTNAME=192.168.1.100 bash scripts/synology-setup.sh
#
# Ports (no conflict with DSM):
#   8080        — HTTP (MWA, BCP, API)
#                 DSM Application Portal: *.domain.de → localhost:8080
#   25/465/587  — SMTP
#   143/993     — IMAP
#   110/995     — POP3
#   9001        — MinIO console
#
# TLS note:
#   DSM → Control Panel → Application Portal → Reverse Proxy
#   Source: https://*.domain.de  →  Destination: http://localhost:8080
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── CoreMail main application ───────────────────────────────────────────────

  coremail:
    image: magpeek/coremail-app:10.2.0
    container_name: coremail
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info

      # Non-superuser role on fresh installs (synology-setup.sh sets COREMAIL_DB_USER); unset = superuser coremail
      DATABASE_URL: postgresql://${COREMAIL_DB_USER:-coremail}:${COREMAIL_DB_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env - run scripts/synology-setup.sh}}@postgres:5432/coremail
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD missing in .env - run scripts/synology-setup.sh}@redis:6379
      COREMAIL_ALLOW_SCHEMA_DATA_LOSS: ${COREMAIL_ALLOW_SCHEMA_DATA_LOSS:-false}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # v8.0 object storage (docs/storage.md): unset = minio (installations from
      # before 8.0, unchanged); new installations: OBJECT_STORAGE=filesystem in .env
      # → mail contents in /volume1/docker/coremail/data/objects (Hyper Backup).
      OBJECT_STORAGE: ${OBJECT_STORAGE:-minio}
      STORAGE_PATH: /data/objects
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-}
      MINIO_CA_FILE: ${MINIO_CA_FILE:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env - run scripts/synology-setup.sh}}
      MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-coremail-attachments}

      # Generated by scripts/synology-setup.sh into .env (openssl rand -hex 32)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing in .env - run scripts/synology-setup.sh}
      PEPPER: ${PEPPER:?PEPPER missing in .env - run scripts/synology-setup.sh}

      # v6: behind the DSM Application Portal every client arrives from the Docker
      # bridge gateway — set TRUST_PROXY (e.g. "uniquelocal") so rate limits and the
      # audit log see the real client IP. Only do this if port 8080 is not reachable
      # by untrusted clients directly. Setup wizard token: docker logs coremail | grep -i "setup token"
      TRUST_PROXY: ${TRUST_PROXY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Branding defaults (9.3) — BCP → Organisation → Branding wins; docs/branding.md
      BRANDING_NAME:  ${BRANDING_NAME:-}
      BRANDING_COLOR: ${BRANDING_COLOR:-}

      # ── Optional tuning (9.0) — set in .env; empty = built-in default ────────
      # Every variable is described in .env.example; details in docs/mail-security.md,
      # docs/mailbox-quotas-recovery.md, docs/mail-protocol-limits.md,
      # docs/api-gateway-security.md and docs/deployment-security.md.
      # Schema sync (pre-migration pg_dump)
      COREMAIL_SCHEMA_BACKUP:      ${COREMAIL_SCHEMA_BACKUP:-}
      COREMAIL_SCHEMA_BACKUP_DIR:  ${COREMAIL_SCHEMA_BACKUP_DIR:-}
      # Quotas, recoverable items, out-of-office
      DELETED_ITEM_RETENTION_DAYS: ${DELETED_ITEM_RETENTION_DAYS:-}
      QUOTA_FULL_PERMANENT:        ${QUOTA_FULL_PERMANENT:-}
      QUOTA_USAGE_CACHE_SEC:       ${QUOTA_USAGE_CACHE_SEC:-60}   # explicit default: an empty value would mean 0 (no cache)
      OOF_REPLY_MEMORY_DAYS:       ${OOF_REPLY_MEMORY_DAYS:-}
      # Inbound filtering
      LOCAL_SPOOF_ACTION:          ${LOCAL_SPOOF_ACTION:-}
      LOCAL_SPOOF_ALLOW:           ${LOCAL_SPOOF_ALLOW:-}
      ARC_TRUSTED_SEALERS:         ${ARC_TRUSTED_SEALERS:-}
      SECURITY_FILTER_FAIL_OPEN:   ${SECURITY_FILTER_FAIL_OPEN:-}
      RULE_PATTERN_STEP_BUDGET:    ${RULE_PATTERN_STEP_BUDGET:-}
      RULE_PATTERN_MESSAGE_STEP_BUDGET: ${RULE_PATTERN_MESSAGE_STEP_BUDGET:-}
      DELETED_ITEM_PURGE_OBJECTS: ${DELETED_ITEM_PURGE_OBJECTS:-}
      DRAFT_WRITE_RATE_LIMIT: ${DRAFT_WRITE_RATE_LIMIT:-}
      DRAFT_WRITE_RATE_WINDOW_SEC: ${DRAFT_WRITE_RATE_WINDOW_SEC:-}
      # SMTP
      OUTBOUND_ALLOW_PRIVATE_MX:   ${OUTBOUND_ALLOW_PRIVATE_MX:-}
      OUTBOUND_DELAY_DSN_HOURS:    ${OUTBOUND_DELAY_DSN_HOURS:-}
      SMTP_TARPIT_MAX_DELAY_MS:    ${SMTP_TARPIT_MAX_DELAY_MS:-}
      SMTP_EXT_SMTPUTF8:           ${SMTP_EXT_SMTPUTF8:-}
      SMTP_EXT_DSN:                ${SMTP_EXT_DSN:-}
      SMTP_EXT_CHUNKING:           ${SMTP_EXT_CHUNKING:-}
      # Brute-force exemptions and connection limits
      MAIL_AUTH_EXEMPT_CIDRS:      ${MAIL_AUTH_EXEMPT_CIDRS:-}
      MAIL_CONN_EXEMPT_CIDRS:      ${MAIL_CONN_EXEMPT_CIDRS:-}
      IMAP_MAX_CONNS:              ${IMAP_MAX_CONNS:-}
      IMAP_MAX_CONNS_PER_IP:       ${IMAP_MAX_CONNS_PER_IP:-}
      IMAP_MAX_CONNS_PER_USER:     ${IMAP_MAX_CONNS_PER_USER:-}
      IMAP_SORT_MAX_MESSAGES:      ${IMAP_SORT_MAX_MESSAGES:-}
      POP3_MAX_CONNS:              ${POP3_MAX_CONNS:-}
      POP3_MAX_CONNS_PER_IP:       ${POP3_MAX_CONNS_PER_IP:-}
      JMAP_UPLOAD_QUOTA_MB:        ${JMAP_UPLOAD_QUOTA_MB:-}
      JMAP_UPLOAD_MAX_BLOBS:       ${JMAP_UPLOAD_MAX_BLOBS:-}
      AUTOCONFIG_RATE_LIMIT:       ${AUTOCONFIG_RATE_LIMIT:-}
      # Web / REST API
      COREMAIL_ALLOWED_ORIGINS:    ${COREMAIL_ALLOWED_ORIGINS:-}
      AUDIT_EXPORT_SIGNING_KEY:    ${AUDIT_EXPORT_SIGNING_KEY:-}
      HTTP_REDIRECT_HTTPS:         ${HTTP_REDIRECT_HTTPS:-false}   # TLS ends at the DSM portal; see docs/api-gateway-security.md
      HTTPS_PUBLIC_PORT:           ${HTTPS_PUBLIC_PORT:-}
      MAIL_SEND_MAX_RECIPIENTS:    ${MAIL_SEND_MAX_RECIPIENTS:-}
      MAIL_SEND_RATE_LIMIT:        ${MAIL_SEND_RATE_LIMIT:-}
      MAIL_SEND_RATE_WINDOW_SEC:   ${MAIL_SEND_RATE_WINDOW_SEC:-}
      IMAGE_PROXY_RATE_LIMIT:      ${IMAGE_PROXY_RATE_LIMIT:-}
      IMAGE_PROXY_RATE_WINDOW_SEC: ${IMAGE_PROXY_RATE_WINDOW_SEC:-}
      BACKUP_IMPORT_MAX_BYTES:     ${BACKUP_IMPORT_MAX_BYTES:-}
      OIDC_TRUST_IDP_MFA_FOR_ADMINS: ${OIDC_TRUST_IDP_MFA_FOR_ADMINS:-}
      SMTP_HOSTNAME:                ${SMTP_HOSTNAME:-}
      POP3_HOSTNAME:                ${POP3_HOSTNAME:-}
      REFERENCES_BACKFILL:          ${REFERENCES_BACKFILL:-}
      REFERENCES_LAZY_BUDGET_MS:    ${REFERENCES_LAZY_BUDGET_MS:-}

      # Internal service URLs
      AUTH_SERVICE_URL: http://localhost:3003
      SECURITY_FILTER_URL: http://localhost:3002
      EAS_SERVICE_URL: http://localhost:3005
      CALDAV_SERVICE_URL: http://localhost:8082
      JMAP_SERVICE_URL: http://localhost:3006

      # External security containers
      RSPAMD_URL: http://rspamd:11334
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      # Service ports
      API_PORT: "3000"
      SECURITY_FILTER_PORT: "3002"
      AUTH_PORT: "3003"
      BACKUP_PORT: "3004"
      EAS_PORT: "3005"
      AUTODISCOVER_PORT: "8081"
      CALDAV_PORT: "8082"
      JMAP_PORT: "3006"

      # WebAuthn (for MFA, optional)
      # WEBAUTHN_RP_ID and WEBAUTHN_ORIGIN are read from ServerSettings.publicHostname
      WEBAUTHN_RP_NAME: CoreMail

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env - run scripts/synology-setup.sh}
      BACKUP_BUCKET: coremail-backups
      BACKUP_SCHEDULE: "0 2 * * *"
      BACKUP_RETENTION_DAYS: "30"
      RETENTION_SCHEDULE: "0 3 * * *"

      WWW_DIR: /app/www

      # VAPID Web Push
      # Generate keys: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@coremail.local}



    ports:
      - "8080:3000"   # HTTP (port 8080 outside → 3000 inside, no DSM conflict)
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    volumes:
      # v8.0: mail contents with OBJECT_STORAGE=filesystem. Only the objects
      # directory is mounted — the parent data/ also holds postgres/redis/minio.
      - /volume1/docker/coremail/data/objects:/data/objects
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      rspamd:   { condition: service_started }
      clamav:   { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      coremail: {}
      # Dedicated app ↔ rspamd network with a fixed app address (rspamd trusts only it)
      rspamd:
        ipv4_address: ${RSPAMD_NET_PREFIX:-10.253.253}.2

  # ── Rspamd 4.0 — anti-spam ──────────────────────────────────────────────────

  rspamd:
    image: rspamd/rspamd:4.0.0
    container_name: coremail-rspamd
    restart: unless-stopped
    volumes:
      - /volume1/docker/coremail/rspamd:/var/lib/rspamd
      # copied by scripts/synology-setup.sh (controller access: worker-controller.inc)
      - /volume1/docker/coremail/config/rspamd/local.d:/etc/rspamd/local.d:ro
    environment:
      RSPAMD_CONTROLLER_SECURE_IP: ${RSPAMD_NET_PREFIX:-10.253.253}.2
      RSPAMD_CONTROLLER_PASSWORD: ${RSPAMD_CONTROLLER_PASSWORD:-}
    expose:
      - "11334"
    healthcheck:
      test: ["CMD-SHELL", "rspamc symbols /dev/null > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      rspamd:
        ipv4_address: ${RSPAMD_NET_PREFIX:-10.253.253}.3

  # ── ClamAV — open-source antivirus ──────────────────────────────────────────

  clamav:
    image: clamav/clamav:stable
    container_name: coremail-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - /volume1/docker/coremail/clamav:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks: [coremail]

  # ── Infrastructure ───────────────────────────────────────────────────────────
  # Volumes mapped to Synology paths (/volume1/docker/coremail/...)
  # so that data persists even without Docker volumes

  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coremail
      POSTGRES_USER: coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      COREMAIL_DB_USER: ${COREMAIL_DB_USER:-}
      COREMAIL_DB_PASSWORD: ${COREMAIL_DB_PASSWORD:-}
    volumes:
      - /volume1/docker/coremail/data/postgres:/var/lib/postgresql/data
      # copied by scripts/synology-setup.sh; run only on a fresh database
      - /volume1/docker/coremail/config/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - /volume1/docker/coremail/config/postgres/02-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped
    # No --appendonly (creates a subdirectory, permission problem on Synology)
    # RDB snapshots write only a single dump.rdb → no permission problems
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD missing in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD missing in .env}
    volumes:
      - /volume1/docker/coremail/data/redis:/data
    user: "0:0"   # Start as root so dump.rdb can be written to the Synology volume
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372   # community build of MinIO (official images discontinued); pinned by digest
    container_name: coremail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env - run scripts/synology-setup.sh}
    volumes:
      - /volume1/docker/coremail/data/minio:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO web console — localhost ONLY (no WAN access!)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [coremail]

networks:
  coremail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # app <-> rspamd only, fixed /29 (change RSPAMD_NET_PREFIX in .env on a collision)
  rspamd:
    driver: bridge
    ipam:
      config:
        - subnet: ${RSPAMD_NET_PREFIX:-10.253.253}.0/29
