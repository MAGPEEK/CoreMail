  # ActiveSync EAS 14.1 (Standard deaktiviert)
  #activesync:
  #  image: magpeek/coremail-activesync:0.9.0
  #  container_name: coremail-activesync
  #  restart: unless-stopped
  #  environment:
  #    DATABASE_URL: postgresql://coremail:CoreMailDB2024!@postgres:5432/coremail
  #    REDIS_URL: redis://:CoreMailRedis2024!@redis:6379
  #    JWT_SECRET: "AENDERE-MICH-min64-zeichen-zufaellige-zeichenfolge-hier-eintragen!!"
