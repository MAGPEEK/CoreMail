name: coremail

# ─────────────────────────────────────────────────────────────────────────────
# CoreMail v3.13.10 — Synology NAS / Container Manager
#
# Einrichtung per SSH:
#   NAS_HOSTNAME=192.168.1.100 bash scripts/synology-setup.sh
#
# Ports (kein Konflikt mit DSM):
#   8080        — HTTP (OWA, ECP, API)
#                 DSM Application Portal: *.domain.de → localhost:8080
#   25/465/587  — SMTP
#   143/993     — IMAP
#   110/995     — POP3
#   9001        — MinIO Konsole
#
# TLS-Hinweis:
#   DSM → Systemsteuerung → Application Portal → Reverseproxy
#   Quelle: https://*.domain.de  →  Ziel: http://localhost:8080
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── CoreMail Hauptanwendung ─────────────────────────────────────────────────

  coremail:
    image: magpeek/coremail-app:3.17.50
    container_name: coremail
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info

      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD:-CoreMail2024!}@postgres:5432/coremail
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisSecret2024}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-MinioSecret2024!}
      MINIO_BUCKET: mail-attachments

      # ⚠ Vor Produktiveinsatz ersetzen: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-CHANGE-ME-openssl-rand-hex-32}
      PEPPER: ${PEPPER:-CHANGE-ME-openssl-rand-hex-32}

      # Interne Service-URLs
      STORAGE_API_URL: http://localhost:3001
      AUTH_SERVICE_URL: http://localhost:3003
      SECURITY_FILTER_URL: http://localhost:3002
      EWS_SERVICE_URL: http://localhost:8080
      EAS_SERVICE_URL: http://localhost:3005
      CALDAV_SERVICE_URL: http://localhost:8082

      # Externe Sicherheits-Container
      RSPAMD_URL: http://rspamd:11334
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      # Service-Ports
      API_PORT: "3000"
      STORAGE_PORT: "3001"
      SECURITY_FILTER_PORT: "3002"
      AUTH_PORT: "3003"
      BACKUP_PORT: "3004"
      EAS_PORT: "3005"
      EWS_PORT: "8080"
      AUTODISCOVER_PORT: "8081"
      CALDAV_PORT: "8082"

      # WebAuthn (für MFA, optional)
      # WEBAUTHN_RP_ID und WEBAUTHN_ORIGIN werden aus ServerSettings.publicHostname gelesen
      WEBAUTHN_RP_NAME: CoreMail

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-MinioSecret2024!}
      BACKUP_BUCKET: coremail-backups
      BACKUP_SCHEDULE: "0 2 * * *"
      BACKUP_RETENTION_DAYS: "30"
      RETENTION_SCHEDULE: "0 3 * * *"

      WWW_DIR: /app/www

      # VAPID Web Push
      # Schlüssel generieren: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@coremail.local}



    ports:
      - "8080:3000"   # HTTP (Port 8080 außen → 3000 innen, kein DSM-Konflikt)
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      rspamd:   { condition: service_started }
      clamav:   { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [coremail]

  # ── Rspamd 4.0 — Anti-Spam ──────────────────────────────────────────────────

  rspamd:
    image: rspamd/rspamd:4.0.0
    container_name: coremail-rspamd
    restart: unless-stopped
    volumes:
      - /volume1/docker/coremail/rspamd:/var/lib/rspamd
    expose:
      - "11333"
      - "11334"
    healthcheck:
      test: ["CMD-SHELL", "rspamc symbols /dev/null > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [coremail]

  # ── ClamAV — Open-Source Antivirus ──────────────────────────────────────────

  clamav:
    image: clamav/clamav:stable
    container_name: coremail-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - /volume1/docker/coremail/clamav:/var/lib/clamav
    expose:
      - "3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks: [coremail]

  # ── Infrastruktur ────────────────────────────────────────────────────────────
  # Volumes auf Synology-Pfade gemappt (/volume1/docker/coremail/...)
  # damit Daten auch ohne Docker-Volumes persistent sind

  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coremail
      POSTGRES_USER: coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CoreMail2024!}
    volumes:
      - /volume1/docker/coremail/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped
    # Kein --appendonly (erzeugt Unterverzeichnis, Permission-Problem auf Synology)
    # RDB-Snapshots schreiben nur eine einzelne dump.rdb → keine Permission-Probleme
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --requirepass ${REDIS_PASSWORD:-RedisSecret2024}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecret2024}
    volumes:
      - /volume1/docker/coremail/data/redis:/data
    user: "0:0"   # Als root starten damit dump.rdb auf Synology-Volume geschrieben werden kann
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  minio:
    image: minio/minio:latest
    container_name: coremail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioSecret2024!}
    volumes:
      - /volume1/docker/coremail/data/minio:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO Web-Konsole — NUR localhost (kein WAN-Zugriff!)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [coremail]

networks:
  coremail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
