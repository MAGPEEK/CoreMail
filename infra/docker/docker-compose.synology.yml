  # ── Frontends ────────────────────────────────────────────────────────────────

  web-client:
    image: magpeek/coremail-web-client:0.9.0
    container_name: coremail-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: https://mail.local:8443/api/v1
      VITE_EWS_URL: https://mail.local:8443/EWS/Exchange.asmx
    expose:
      - "80"
    networks: [coremail]

  admin-panel:
    image: magpeek/coremail-admin-panel:0.9.0
    container_name: coremail-admin
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: https://mail.local:8443/api/v1
    expose:
      - "80"
    networks: [coremail]

  # ── nginx Reverse Proxy ───────────────────────────────────────────────────────
  #
  # Verwendet Ports 8080 (HTTP→HTTPS) und 8443 (HTTPS) um Konflikte
  # mit der Synology DSM-Weboberfläche zu vermeiden.
  # TLS-Zertifikat: /volume1/docker/coremail/certs/
  # (siehe Anleitung oben für self-signed Zertifikat)

  nginx:
    image: nginx:alpine
    container_name: coremail-nginx
    restart: unless-stopped
    ports:
      - "8080:80"     # HTTP (→ leitet auf HTTPS um)
      - "8443:443"    # HTTPS — OWA, ECP, EWS, API, Autodiscover
    volumes:
      - /volume1/docker/coremail/certs:/etc/nginx/certs:ro
      - /volume1/docker/coremail/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ews-server:   { condition: service_healthy }
      autodiscover: { condition: service_healthy }
      api-gateway:  { condition: service_healthy }
      auth-service: { condition: service_healthy }
      - web-client
      - admin-panel
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
# Alle persistenten Daten liegen unter /volume1/docker/coremail/data/
# (bind mounts statt named volumes — besser für Synology-Backups via
#  Hyper Backup und einfachere Inspektion der Daten)

# ─────────────────────────────────────────────────────────────────────────────
# Netzwerk
# ─────────────────────────────────────────────────────────────────────────────

networks:
  coremail:
    name: coremail_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24   # Festes Subnetz — kein Konflikt mit DSM (172.17/172.18)
