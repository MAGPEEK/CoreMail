  #  networks: [coremail]

  # CalDAV + CardDAV (Standard deaktiviert)
  #caldav-server:
  #  image: magpeek/coremail-caldav-server:0.9.0
  #  container_name: coremail-caldav
  #  restart: unless-stopped
  #  environment:
  #    DATABASE_URL: postgresql://coremail:CoreMailDB2024!@postgres:5432/coremail
  #    STORAGE_API_URL: http://storage-api:3001
  #    AUTH_SERVICE_URL: http://auth-service:3003
  #    JWT_SECRET: "AENDERE-MICH-min64-zeichen-zufaellige-zeichenfolge-hier-eintragen!!"
