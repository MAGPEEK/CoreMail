name: coremail

# ─────────────────────────────────────────────────────────────────────────────
# CoreMail v0.9.0 — Synology NAS / Container Manager Setup
#
# Nur 2 Container — ideal für NAS und Heimserver.
# Ports 8080/8443 statt 80/443 → kein Konflikt mit DSM-Webinterface.
#
# Voraussetzungen:
#   1. Einrichtungs-Skript ausführen (per SSH als root):
#        NAS_HOSTNAME=192.168.1.100 bash synology-setup.sh
#      Das Skript erstellt TLS-Zertifikate und kopiert diese Datei.
#
#   2. Oder manuell:
#        mkdir -p /volume1/docker/coremail/{certs,data}
#        openssl req -x509 -newkey rsa:4096 -days 3650 -nodes \
#          -keyout /volume1/docker/coremail/certs/privkey.pem \
#          -out    /volume1/docker/coremail/certs/fullchain.pem \
#          -subj "/CN=192.168.1.100/O=CoreMail/C=DE"
#
# Zugriff nach dem Start:
#   OWA Webmail:  https://<NAS-IP>:8443/owa/
#   ECP Admin:    https://<NAS-IP>:8443/ecp/
#   MinIO:        http://<NAS-IP>:9001
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Datenbank (PostgreSQL + Redis + MinIO) ───────────────────────────────────

  coremail-db:
    image: magpeek/coremail-db:0.9.0
    container_name: coremail-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: coremail
      POSTGRES_USER: coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CoreMail2024!}
      PGDATA: /var/lib/postgresql/data/pgdata
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecret2024}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioSecret2024!}
    volumes:
      - /volume1/docker/coremail/data/postgres:/var/lib/postgresql/data
      - /volume1/docker/coremail/data/redis:/data/redis
      - /volume1/docker/coremail/data/minio:/data/minio
    ports:
      - "9001:9001"   # MinIO Web Console
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [coremail]

  # ── Hauptanwendung (alle Services + nginx) ────────────────────────────────────

  coremail-app:
    image: magpeek/coremail-app:0.9.0
    container_name: coremail-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info

      # Datenbank (zeigt auf coremail-db)
      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD:-CoreMail2024!}@coremail-db:5432/coremail
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisSecret2024}@coremail-db:6379
      MINIO_ENDPOINT: coremail-db
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-MinioSecret2024!}
      MINIO_BUCKET: mail-attachments

      # ⚠ WICHTIG: Vor Produktiveinsatz durch sichere Zufallswerte ersetzen!
      # openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-CHANGE-ME-replace-with-openssl-rand-hex-32-output}
      PEPPER: ${PEPPER:-CHANGE-ME-replace-with-openssl-rand-hex-32-output}

      # Hostname der Synology NAS (IP-Adresse oder Domainname)
      MAIL_HOSTNAME: ${NAS_HOSTNAME:-mail.local}
      SMTP_HOSTNAME: ${NAS_HOSTNAME:-mail.local}
      IMAP_HOSTNAME: ${NAS_HOSTNAME:-mail.local}

      # Interne Service-URLs (localhost, gleicher Container)
      STORAGE_API_URL: http://localhost:3001
      AUTH_SERVICE_URL: http://localhost:3003
      SECURITY_FILTER_URL: http://localhost:3002
      EWS_SERVICE_URL: http://localhost:8080

      # Service-Ports
      STORAGE_PORT: "3001"
      AUTH_PORT: "3003"
      SECURITY_FILTER_PORT: "3002"
      API_PORT: "3000"
      EWS_PORT: "8080"
      AUTODISCOVER_PORT: "8081"
      CALDAV_PORT: "8082"
      BACKUP_PORT: "3004"
      EAS_PORT: "3005"

      # URLs (mit Port 8443 für Synology)
      EWS_URL: https://${NAS_HOSTNAME:-mail.local}:8443/EWS/Exchange.asmx
      OWA_URL: https://${NAS_HOSTNAME:-mail.local}:8443/owa/
      AUTODISCOVER_BASE: https://${NAS_HOSTNAME:-mail.local}:8443
      EAS_URL: https://${NAS_HOSTNAME:-mail.local}:8443/Microsoft-Server-ActiveSync

      # WebAuthn
      WEBAUTHN_RP_NAME: CoreMail
      WEBAUTHN_RP_ID: ${NAS_HOSTNAME:-mail.local}
      WEBAUTHN_ORIGIN: https://${NAS_HOSTNAME:-mail.local}:8443

      # Backup
      S3_ENDPOINT: http://coremail-db:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-MinioSecret2024!}
      BACKUP_BUCKET: coremail-backups
      BACKUP_SCHEDULE: "0 2 * * *"
      BACKUP_RETENTION_DAYS: "30"

    ports:
      # Ports versetzt → kein Konflikt mit Synology DSM (80/443)
      - "8080:80"     # HTTP (Redirect zu HTTPS)
      - "8443:443"    # HTTPS (OWA, ECP, API, EWS)
      - "25:25"       # SMTP Inbound
      - "465:465"     # SMTPS
      - "587:587"     # Submission
      - "143:143"     # IMAP
      - "993:993"     # IMAPS
      - "110:110"     # POP3
      - "995:995"     # POP3S
    volumes:
      - /volume1/docker/coremail/certs:/etc/nginx/certs:ro
    depends_on:
      coremail-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────

networks:
  coremail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
