; ─────────────────────────────────────────────────────────────────────────────
; CoreMail DB Container — supervisord-Konfiguration
;
; Verwaltet: PostgreSQL 16 + Redis 7 + MinIO
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─────────────────────────────────────────────────────────────────────────────
; PostgreSQL
; ─────────────────────────────────────────────────────────────────────────────

[program:postgres]
command=/usr/local/bin/docker-entrypoint.sh postgres
user=postgres
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─────────────────────────────────────────────────────────────────────────────
; Redis
; ─────────────────────────────────────────────────────────────────────────────

[program:redis]
command=sh -c 'exec redis-server --appendonly yes --dir /data/redis --loglevel notice $([ -n "$REDIS_PASSWORD" ] && echo "--requirepass $REDIS_PASSWORD")'
autostart=true
autorestart=true
priority=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─────────────────────────────────────────────────────────────────────────────
; MinIO
; ─────────────────────────────────────────────────────────────────────────────

[program:minio]
command=/usr/local/bin/minio server /data/minio --console-address ":9001"
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
