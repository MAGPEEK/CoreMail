# ─────────────────────────────────────────────────────────────────────────────
# nginx — CoreMail Synology test configuration
#
# Differences from the production nginx.conf:
#   • HTTP on port 80  (external: 8080)
#   • HTTPS on port 443 (external: 8443) — no conflict with DSM
#   • self-signed certificate from /etc/nginx/certs/
#   • ActiveSync block commented out (optional)
#   • No rate limiting (simplified for tests)
#
# Place on the NAS: /volume1/docker/coremail/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        # ── OWA — Webmail ─────────────────────────────────────────────────────
        location /owa/ {
            proxy_pass http://web-client:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── ECP — Admin panel ─────────────────────────────────────────────────
        location /bcp/ {
            proxy_pass http://admin-panel:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── EWS — Exchange Web Services ───────────────────────────────────────
        location /EWS/ {
            proxy_pass http://ews-server:8080/EWS/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # ── MAPI over HTTP (Outlook 2013+) ────────────────────────────────────
        location /mapi/ {
            proxy_pass http://ews-server:8080/mapi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # ── OAB — Offline Address Book ────────────────────────────────────────
        location /OAB/ {
            proxy_pass http://ews-server:8080/OAB/;
            proxy_set_header Host $host;
        }

        # ── Autodiscover v1 ───────────────────────────────────────────────────
        location /Autodiscover/ {
            proxy_pass http://autodiscover:8081/Autodiscover/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Autodiscover v2 (Modern Auth) ─────────────────────────────────────
        location /autodiscover/ {
            proxy_pass http://autodiscover:8081/autodiscover/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── ActiveSync EAS (optional — uncomment to enable) ───────────────────
        #location /Microsoft-Server-ActiveSync {
        #    proxy_pass http://activesync:3005/Microsoft-Server-ActiveSync;
        #    proxy_set_header Host $host;
        #    proxy_set_header X-Real-IP $remote_addr;
        #    proxy_read_timeout 600s;
        #    proxy_buffering off;
        #    client_max_body_size 25m;
        #}

        # ── REST API Gateway ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api-gateway:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # SSE support (live updates)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # ── Auth service ──────────────────────────────────────────────────────
        location /auth/ {
            proxy_pass http://auth-service:3003/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── PowerShell Remoting (EMS) ─────────────────────────────────────────
        location /PowerShell/ {
            proxy_pass http://api-gateway:3000/PowerShell/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass http://api-gateway:3000/healthz;
        }

        # ── Root → OWA ────────────────────────────────────────────────────────
        location = / {
            return 302 /owa/;
        }
    }
}
