# ─────────────────────────────────────────────────────────────────────────────
# nginx — CoreMail App-Container-Konfiguration
#
# Verwendet innerhalb des monolithischen coremail-app-Containers.
# Alle Upstream-Adressen zeigen auf localhost (gleicher Container).
# Statische Frontend-Dateien werden direkt aus /app/www/ ausgeliefert.
#
# Externe Ports (via docker-compose Port-Mapping):
#   80  → HTTP  (Redirect zu HTTPS)
#   443 → HTTPS
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Sicherheits-Header
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_max_body_size 50M;
    server_tokens       off;

    # Gzip-Kompression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Upstreams (alle auf localhost) ────────────────────────────────────────

    upstream api_gateway    { server 127.0.0.1:3000; keepalive 16; }
    upstream auth_service   { server 127.0.0.1:3003; keepalive 8;  }
    upstream ews_server     { server 127.0.0.1:8080; keepalive 8;  }
    upstream autodiscover   { server 127.0.0.1:8081; keepalive 4;  }
    upstream caldav_server  { server 127.0.0.1:8082; keepalive 4;  }
    upstream activesync     { server 127.0.0.1:3005; keepalive 8;  }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (aktivieren in Produktion)
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # Proxy-Einstellungen (global)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ── OWA — Webmail (statische Dateien) ─────────────────────────────────
        location /owa/ {
            alias /app/www/owa/;
            try_files $uri $uri/ /owa/index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # ── ECP — Admin-Panel (statische Dateien) ─────────────────────────────
        location /ecp/ {
            alias /app/www/ecp/;
            try_files $uri $uri/ /ecp/index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # ── EWS — Exchange Web Services ───────────────────────────────────────
        location /EWS/ {
            proxy_pass http://ews_server/EWS/;
            proxy_read_timeout 300s;
        }

        # ── MAPI over HTTP (Outlook 2013+) ────────────────────────────────────
        location /mapi/ {
            proxy_pass http://ews_server/mapi/;
            proxy_read_timeout 300s;
        }

        # ── OAB — Offline Address Book ────────────────────────────────────────
        location /OAB/ {
            proxy_pass http://ews_server/OAB/;
        }

        # ── Autodiscover v1 ───────────────────────────────────────────────────
        location /Autodiscover/ {
            proxy_pass http://autodiscover/Autodiscover/;
        }

        # ── Autodiscover v2 (Modern Auth) ─────────────────────────────────────
        location /autodiscover/ {
            proxy_pass http://autodiscover/autodiscover/;
        }

        # ── ActiveSync EAS ────────────────────────────────────────────────────
        location /Microsoft-Server-ActiveSync {
            proxy_pass http://activesync/Microsoft-Server-ActiveSync;
            proxy_read_timeout 600s;
            proxy_buffering off;
            client_max_body_size 25m;
        }

        # ── CalDAV / CardDAV ──────────────────────────────────────────────────
        location /dav/ {
            proxy_pass http://caldav_server/dav/;
            proxy_read_timeout 60s;
        }

        # ── REST API Gateway ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_gateway/api/;

            # SSE-Support (Live-Updates)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # ── Auth-Service ──────────────────────────────────────────────────────
        location /auth/ {
            proxy_pass http://auth_service/auth/;
        }

        # ── PowerShell Remoting (EMS) ─────────────────────────────────────────
        location /PowerShell/ {
            proxy_pass http://api_gateway/PowerShell/;
            proxy_read_timeout 300s;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        # ── Health-Check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass http://api_gateway/healthz;
            access_log off;
        }

        # ── Root → OWA ────────────────────────────────────────────────────────
        location = / {
            return 302 /owa/;
        }

        # ── Statische Assets (lange Cache-Zeit) ───────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            root /app/www;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
