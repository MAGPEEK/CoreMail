worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;

        client_max_body_size 50M;

        # OWA — Webmail Client
        location /owa/ {
            proxy_pass http://web-client:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ECP — Admin Panel
        location /ecp/ {
            proxy_pass http://admin-panel:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # EWS — Exchange Web Services
        location /EWS/ {
            proxy_pass http://ews-server:8080/EWS/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # MAPI over HTTP (Outlook 2016+)
        location /mapi/ {
            proxy_pass http://ews-server:8080/mapi/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # Autodiscover v1
        location /Autodiscover/ {
            proxy_pass http://autodiscover:8081/Autodiscover/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Autodiscover v2 (Modern Auth)
        location /autodiscover/ {
            proxy_pass http://autodiscover:8081/autodiscover/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Offline Address Book
        location /OAB/ {
            proxy_pass http://ews-server:8080/OAB/;
            proxy_set_header Host $host;
        }

        # ActiveSync (EAS Phase 6)
        location /Microsoft-Server-ActiveSync {
            proxy_pass http://activesync:3005/Microsoft-Server-ActiveSync;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;  # Long-poll for Ping command
            proxy_buffering off;
            client_max_body_size 25m;
        }

        # REST API Gateway
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api-gateway:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # Auth Service — login, MFA, app-passwords, sessions
        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://auth-service:3003/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OIDC callback (SSO redirect_uri)
        location /auth/oidc/callback {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://auth-service:3003/auth/oidc/callback;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth endpoints via API Gateway (legacy path)
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://api-gateway:3000/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            proxy_pass http://api-gateway:3000/health;
        }

        # Default → OWA
        location = / {
            return 302 /owa/;
        }
    }
}
