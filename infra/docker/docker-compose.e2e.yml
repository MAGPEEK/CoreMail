# ═════════════════════════════════════════════════════════════════════════════
#  CoreMail — end-to-end test override (see docs/e2e.md)
#
#    docker compose -p coremail-e2e --env-file <e2e.env> \
#      -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.e2e.yml up -d
#
#  • Uses the locally built image coremail-app:e2e (docker build -f infra/docker/Dockerfile.app -t coremail-app:e2e .)
#  • Publishes only high host ports on 127.0.0.1 — does not collide with a
#    production stack on the same machine.
#  • Adds an SMTP sink ("sink") — the e2e runner configures it as smarthost, so
#    outbound mail (auto-replies, DSNs, relay) never leaves the test network.
#  • Own container names; use a dedicated project name (-p coremail-e2e) so
#    `down -v` only removes the e2e volumes.
#  • Secrets: coremail-init writes ./secrets (infra/docker/secrets, git-ignored)
#    unless e2e.env sets COREMAIL_SECRETS_PATH (docs/e2e.md: $E2E_STATE_DIR/secrets).
#    The setup step reads the token from /secrets/setup-token.
# ═════════════════════════════════════════════════════════════════════════════

services:
  coremail:
    image: ${E2E_IMAGE:-coremail-app:e2e}
    container_name: coremail-e2e
    restart: "no"
    environment:
      # The e2e runner talks plain HTTP to port 3000; MAPI Basic auth is HTTPS-only otherwise.
      MAPI_ALLOW_PLAIN_HTTP: "true"
      # No CA certificate in the e2e stack: let Autodiscover announce mapiHttp (docs/mapi.md).
      MAPI_HTTPS_TRUSTED: "true"
    ports: !override
      - "127.0.0.1:12525:25"
      - "127.0.0.1:12465:465"
      - "127.0.0.1:12587:587"
      - "127.0.0.1:12143:143"
      - "127.0.0.1:12993:993"
      - "127.0.0.1:12110:110"
      - "127.0.0.1:12995:995"
      - "127.0.0.1:18080:3000"
      - "127.0.0.1:18443:443"
    depends_on: !override
      coremail-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      sink:     { condition: service_started }
    # Own rspamd subnet so a production stack on the same host does not collide
    networks:
      rspamd:
        ipv4_address: ${E2E_RSPAMD_NET_PREFIX:-10.253.254}.2

  coremail-init:
    image: ${E2E_IMAGE:-coremail-app:e2e}
    container_name: coremail-e2e-init
    restart: "no"

  postgres:
    container_name: coremail-e2e-postgres
    restart: "no"
  redis:
    container_name: coremail-e2e-redis
    restart: "no"
  minio:
    # minio/minio is no longer published on Docker Hub (pull access denied since
    # MinIO stopped community images) — use a maintained community build.
    image: ${E2E_MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: coremail-e2e-minio
    restart: "no"
    ports: !reset []
  rspamd:
    container_name: coremail-e2e-rspamd
    restart: "no"
    environment:
      RSPAMD_CONTROLLER_SECURE_IP: ${E2E_RSPAMD_NET_PREFIX:-10.253.254}.2
    networks:
      rspamd:
        ipv4_address: ${E2E_RSPAMD_NET_PREFIX:-10.253.254}.3
  clamav:
    container_name: coremail-e2e-clamav
    restart: "no"

  # Local SMTP sink (smarthost target). Stores every received message and lists
  # them over HTTP: GET http://127.0.0.1:18025/messages
  sink:
    image: node:22-alpine
    container_name: coremail-e2e-sink
    restart: "no"
    command: ["node", "/sink/smtp-sink.mjs"]
    volumes:
      - ../../scripts/e2e/smtp-sink.mjs:/sink/smtp-sink.mjs:ro
    ports:
      - "127.0.0.1:18025:8025"
    networks: [coremail]

networks:
  rspamd:
    ipam:
      config: !override
        - subnet: ${E2E_RSPAMD_NET_PREFIX:-10.253.254}.0/29
