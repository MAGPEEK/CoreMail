; ─────────────────────────────────────────────────────────────────────────────
; CoreMail App Container — supervisord-Konfiguration
;
; Security-Hardening (2026-05-16):
;   • Alle Programme laufen als user=node (UID 1000) — nicht als root.
;   • supervisord selbst startet als root (via tini als PID 1) und wechselt
;     mit setuid() zu node. Dafür benötigt der Container SETUID + SETGID
;     (siehe docker-compose.yml → cap_add).
;   • Das node-Binary hat cap_net_bind_service=+eip gesetzt (setcap im
;     Dockerfile), damit Nicht-Root-Prozesse privilegierte Ports (< 1024)
;     binden können (SMTP 25, IMAP 143, POP3 110).
;   • Der supervisord-Socket ist nur für root beschreibbar (chmod=0700).
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisor/supervisord.pid
; Laufzeit-Verzeichnis (chown node in Dockerfile)
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
; Nur root (supervisord) darf den Socket beschreiben
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

; ─────────────────────────────────────────────────────────────────────────────
; Storage API — Priorität 15: muss vor allen anderen Services laufen
; Bindet NUR auf 127.0.0.1 (loopback) — kein externer Zugriff möglich.
; ─────────────────────────────────────────────────────────────────────────────

[program:storage-api]
command=node /app/packages/storage/dist/server.js
directory=/app
user=node
autostart=true
autorestart=true
priority=15
startretries=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

