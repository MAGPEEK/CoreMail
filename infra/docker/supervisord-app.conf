; ─────────────────────────────────────────────────────────────────────────────
; CoreMail App Container — supervisord configuration
;
; Security hardening (2026-05-16):
;   • All programs run as user=node (UID 1000) — not as root.
;   • supervisord itself starts as root (via tini as PID 1) and switches
;     to node with setuid(). For this the container needs SETUID + SETGID
;     (see docker-compose.yml → cap_add).
;   • The node binary has cap_net_bind_service=+eip set (setcap in the
;     Dockerfile) so that non-root processes can bind privileged ports (< 1024)
;     (SMTP 25, IMAP 143, POP3 110).
;   • The supervisord socket is writable only by root (chmod=0700).
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisor/supervisord.pid
; Runtime directory (chown node in Dockerfile)
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
; Only root (supervisord) may write to the socket
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

; ─────────────────────────────────────────────────────────────────────────────
; Storage API — priority 15: must run before all other services
; Binds ONLY to 127.0.0.1 (loopback) — no external access possible.
; ─────────────────────────────────────────────────────────────────────────────

[program:storage-api]
command=node /app/packages/storage/dist/server.js
directory=/app
user=node
autostart=true
autorestart=true
priority=15
startretries=10
startsecs=3
environment=STORAGE_PORT="3001"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

