; ─────────────────────────────────────────────────────────────────────────────
; Gruppen-Definition (alle starten zusammen, kein sequenzieller Start nötig
; da autorestart=true bei Verbindungsfehlern zum DB-Container hilft)
; ─────────────────────────────────────────────────────────────────────────────

[group:infrastructure]
programs=storage-api,auth-service,security-filter
priority=15

[group:gateway]
programs=api-gateway,ews-server,autodiscover
priority=30

[group:protocols]
programs=smtp-server,imap-server,pop3-server,caldav-server
