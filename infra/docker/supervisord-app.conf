; ─────────────────────────────────────────────────────────────────────────────
; CoreMail App Container — supervisord-Konfiguration
;
; Verwaltet alle Node.js-Services und nginx.
; Umgebungsvariablen werden vom Docker-Container geerbt.
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ─────────────────────────────────────────────────────────────────────────────
; nginx — Reverse Proxy + Static Files
; Priorität 10: startet zuerst (andere Services brauchen ihn nicht)
; ─────────────────────────────────────────────────────────────────────────────

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─────────────────────────────────────────────────────────────────────────────
; Storage API — Priorität 15: muss vor allen anderen Services laufen
; ─────────────────────────────────────────────────────────────────────────────

[program:storage-api]
command=node /app/packages/storage/dist/server.js
directory=/app
autostart=true
autorestart=true
priority=15
startretries=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

