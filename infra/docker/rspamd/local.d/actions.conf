# CoreMail — rspamd action thresholds
# Values are adjusted dynamically via the BCP (through the rspamd controller API)
#
# local.d/actions.conf is included INSIDE the `actions { }` section of rspamd.conf —
# a nested `actions { … }` wrapper makes rspamd 4 refuse to start
# ("invalid action definition for: 'actions'").

reject = 15;        # Score from which e-mails are rejected
add_header = 6;     # Score from which X-Spam-* headers are set
greylist = 4;       # Score from which greylisting becomes active
