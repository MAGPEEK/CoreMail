name: coremail

# ═════════════════════════════════════════════════════════════════════════════
#  CoreMail 5.9.0 — Docker Compose (production, single host)
#
#  Getting started in 3 steps:
#
#    1. Create the configuration (in the repo root):
#         bash scripts/setup.sh            # generates .env with random keys
#       or by hand:
#         cp .env.example .env             # and replace the 5 CHANGE-ME values
#
#    2. Start the stack:
#         docker compose -f infra/docker/docker-compose.yml up -d
#       On first start CoreMail creates the database schema (approx. 60–90 s).
#
#    3. Set up in the browser:
#         http://<server-ip>:3000/bcp/     → setup wizard: admin account + domain
#       Then obtain a certificate (Let's Encrypt) in the BCP under SSL/TLS — from
#       then on https://mail.<domain>/ is reachable. Alternatively via CLI:
#         docker exec -it coremail coremail cert letsencrypt \
#           --domains mail.example.de --email admin@example.de --services SMTP,IMAP,POP3
#
#  What MUST be set in .env (everything else has sensible defaults):
#    POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD  — database passwords
#    JWT_SECRET, PEPPER                                       — 64 hex characters each (openssl rand -hex 32)
#
#  Host ports (open in firewall/router):
#    25  SMTP inbound (required for incoming mail)   143/993  IMAP / IMAPS
#    587 SMTP submission (mail clients, STARTTLS)    110/995  POP3 / POP3S (optional)
#    465 SMTPS (implicit TLS)                        80       HTTP → Let's Encrypt challenge + redirect
#    443 HTTPS (webmail, admin panel, JMAP, EWS, ActiveSync, CalDAV, Autodiscover)
#    3000 HTTP without TLS — for initial setup and behind your own reverse proxy
#
#  Containers: coremail (all services) · postgres · redis · minio · rspamd · clamav
#  All data lives in named Docker volumes (see below) → backup = back up the volumes.
# ═════════════════════════════════════════════════════════════════════════════

services:

  # ───────────────────────────────────────────────────────────────────────────
  #  coremail — the application (SMTP/IMAP/POP3/JMAP/EWS/ActiveSync/CalDAV,
  #  REST API, webmail "MWA", admin panel "BCP", admin CLI `coremail`)
  # ───────────────────────────────────────────────────────────────────────────
  coremail:
    image: magpeek/coremail-app:${COREMAIL_VERSION:-5.9.0}
    # Use your own build instead of the Docker Hub image:
    # build:
    #   context: ../..
    #   dockerfile: infra/docker/Dockerfile.app
    container_name: coremail
    restart: unless-stopped
    environment:
      # ── Required: keys from .env (startup aborts with a hint if empty) ──────
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing in .env  →  openssl rand -hex 32}
      PEPPER:     ${PEPPER:?PEPPER missing in .env  →  openssl rand -hex 32}

      # ── Databases (hostnames = container names in this Compose file) ────────
      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}@postgres:5432/coremail
      REDIS_URL:    redis://:${REDIS_PASSWORD:?REDIS_PASSWORD missing in .env}@redis:6379
      MINIO_ENDPOINT:   minio
      MINIO_PORT:       "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD missing in .env}
      MINIO_BUCKET:     mail-attachments
      # Backups go to the same MinIO (bucket coremail-backups)
      S3_ENDPOINT:   http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # ── Spam and virus protection (containers below) ─────────────────────────
      RSPAMD_URL:  http://rspamd:11334
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      # ── Operation ────────────────────────────────────────────────────────────
      NODE_ENV:  production
      LOG_LEVEL: ${LOG_LEVEL:-info}            # error | warn | info | debug
      TZ:        ${TZ:-Europe/Berlin}
      # Internal service in the same container — do not change
      SECURITY_FILTER_URL: http://localhost:3002

      # ── Schedules (cron, UTC) ────────────────────────────────────────────────
      BACKUP_SCHEDULE:       ${BACKUP_SCHEDULE:-0 2 * * *}   # daily full backup
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      RETENTION_SCHEDULE:    ${RETENTION_SCHEDULE:-0 3 * * *} # retention policies

      # ── Optional: browser push for webmail (npx web-push generate-vapid-keys) ─
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:admin@example.com}

      # ── Optional: different HTTPS port if 443 is already in use on the host ──
      # HTTPS_PORT: "8443"     # then also map "8443:8443" below

    ports:
      - "25:25"       # SMTP inbound (server → server)
      - "465:465"     # SMTPS (implicit TLS)
      - "587:587"     # SMTP submission (mail clients, STARTTLS)
      - "143:143"     # IMAP (STARTTLS)
      - "993:993"     # IMAPS (implicit TLS)
      - "110:110"     # POP3 (STARTTLS)         — can be removed if POP3 is not wanted
      - "995:995"     # POP3S (implicit TLS)    — same
      - "80:3000"     # HTTP: Let's Encrypt challenge (HTTP-01) + redirect to HTTPS
      - "443:443"     # HTTPS: integrated TLS proxy (certificate in BCP → SSL/TLS)
      - "3000:3000"   # HTTP without TLS: initial setup; behind your own reverse proxy (Traefik,
                      # Caddy, nginx, Synology) → use only this port, remove 80/443 above
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      rspamd:   { condition: service_started }
      clamav:   { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Resource limits (against load spikes); increase for >100 users
    deploy:
      resources:
        limits:
          cpus: '${COREMAIL_CPU_LIMIT:-2}'
          memory: ${COREMAIL_MEM_LIMIT:-2g}
    networks: [coremail]

  # ───────────────────────────────────────────────────────────────────────────
  #  Infrastructure — standard images, no customization needed
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       coremail
      POSTGRES_USER:     coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [coremail]

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [coremail]

  minio:
    # Object storage for attachments, raw mails, quarantine and backups
    image: minio/minio:latest
    container_name: coremail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO console local only (ssh -L 9001:localhost:9001 <server>)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [coremail]

  rspamd:
    # Spam filter (Bayes, DKIM/SPF/DMARC evaluation, fuzzy, URL lists)
    image: rspamd/rspamd:4.0.0
    container_name: coremail-rspamd
    restart: unless-stopped
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd-data:/var/lib/rspamd
    healthcheck:
      test: ["CMD-SHELL", "rspamc symbols /dev/null > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [coremail]

  clamav:
    # Virus scanner; downloads the signatures on first start (~300 MB, a few minutes)
    image: clamav/clamav:stable
    container_name: coremail-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"   # daily signature updates
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────
#  Data — back up these volumes (docker run --rm -v coremail_pgdata:/d alpine tar …)
#    pgdata      PostgreSQL: users, folders, mail metadata, settings
#    miniodata   MinIO: mail contents, attachments, backups
#    redisdata   Redis: sessions, queues (expendable)
#    rspamd-data Bayes training data    clamav-data virus signatures (re-downloaded)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:
  miniodata:
  rspamd-data:
  clamav-data:

networks:
  coremail:
    driver: bridge
