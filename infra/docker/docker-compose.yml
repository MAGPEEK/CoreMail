name: coremail

# ─────────────────────────────────────────────────────────────────────────────
# CoreMail v0.11.0 — Minimaler Stack
#
# Schnellstart:
#   cp .env.example .env           # Hostname und Passwörter anpassen
#   docker compose up -d           # Images von Docker Hub laden und starten
#
# Ports:
#   3000  — HTTP (OWA Webmail, ECP Admin, REST API, Autodiscover, EWS)
#           Für HTTPS eigenen Reverse Proxy vorschalten
#           (Traefik, Caddy, nginx, DSM Application Portal …)
#   25/465/587  — SMTP
#   143/993     — IMAP
#   110/995     — POP3 (optional)
#   9001        — MinIO Web-Konsole (Dateiinspektion/Backup)
#
# Mit Observability:
#   docker compose --profile observability up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── CoreMail Hauptanwendung ───────────────────────────────────────────────────
  # Enthält: alle Node.js-Services + OWA/ECP-Frontends (supervisord)
  # Kein nginx — api-gateway übernimmt HTTP-Routing auf Port 3000

  coremail:
    image: magpeek/coremail-app:1.1.5
    # Lokaler Build:
    # build:
    #   context: ../..
    #   dockerfile: infra/docker/Dockerfile.app
    container_name: coremail
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Datenbank
      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD}@postgres:5432/coremail
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: mail-attachments

      # Sicherheitsschlüssel
      JWT_SECRET: ${JWT_SECRET}
      PEPPER: ${PEPPER}

      # Mailserver-Hostname
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      SMTP_HOSTNAME: ${MAIL_HOSTNAME}
      IMAP_HOSTNAME: ${MAIL_HOSTNAME}

      # Interne Service-URLs (localhost, gleicher Container)
      STORAGE_API_URL: http://localhost:3001
      AUTH_SERVICE_URL: http://localhost:3003
      SECURITY_FILTER_URL: http://localhost:3002
      EWS_SERVICE_URL: http://localhost:8080
      EAS_SERVICE_URL: http://localhost:3005
      CALDAV_SERVICE_URL: http://localhost:8082

      # Service-Ports
      API_PORT: "3000"
      STORAGE_PORT: "3001"
      SECURITY_FILTER_PORT: "3002"
      AUTH_PORT: "3003"
      BACKUP_PORT: "3004"
      EAS_PORT: "3005"
      EWS_PORT: "8080"
      AUTODISCOVER_PORT: "8081"
      CALDAV_PORT: "8082"

      # URLs (für Autodiscover und EWS-Antworten)
      EWS_URL: http://${MAIL_HOSTNAME}/EWS/Exchange.asmx
      OWA_URL: http://${MAIL_HOSTNAME}/owa/
      AUTODISCOVER_BASE: http://${MAIL_HOSTNAME}
      EAS_URL: http://${MAIL_HOSTNAME}/Microsoft-Server-ActiveSync

      # WebAuthn (für MFA, optional)
      WEBAUTHN_RP_NAME: CoreMail
      WEBAUTHN_RP_ID: ${MAIL_HOSTNAME}
      WEBAUTHN_ORIGIN: http://${MAIL_HOSTNAME}

      # Backup
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: coremail-backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}

      # Statische Dateien (OWA/ECP Frontends im Container)
      WWW_DIR: /app/www

      # VAPID Web Push (Phase 10)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@coremail.local}

      # SMTP-Gateway-Modus (Phase 10 — optional)
      GATEWAY_MODE: ${GATEWAY_MODE:-false}
      GATEWAY_UPSTREAM_HOST: ${GATEWAY_UPSTREAM_HOST:-}
      GATEWAY_UPSTREAM_PORT: ${GATEWAY_UPSTREAM_PORT:-25}
      GATEWAY_UPSTREAM_TLS: ${GATEWAY_UPSTREAM_TLS:-false}
      GATEWAY_UPSTREAM_USER: ${GATEWAY_UPSTREAM_USER:-}
      GATEWAY_UPSTREAM_PASS: ${GATEWAY_UPSTREAM_PASS:-}
      GATEWAY_DOMAINS: ${GATEWAY_DOMAINS:-}
      GATEWAY_FILTER: ${GATEWAY_FILTER:-true}

      # Aufbewahrungsrichtlinien-Zeitplan (Phase 9)
      RETENTION_SCHEDULE: ${RETENTION_SCHEDULE:-0 3 * * *}

    ports:
      - "3000:3000"   # HTTP — OWA, ECP, API, Auth, EWS, Autodiscover
      - "25:25"       # SMTP Inbound
      - "465:465"     # SMTPS (implizites TLS)
      - "587:587"     # Submission (STARTTLS)
      - "143:143"     # IMAP (STARTTLS)
      - "993:993"     # IMAPS (implizites TLS)
      - "110:110"     # POP3 (STARTTLS)
      - "995:995"     # POP3S (implizites TLS)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [coremail]

  # ── Infrastruktur (Standard-Images) ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coremail
      POSTGRES_USER: coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      # $$REDIS_PASSWORD → Compose schreibt $REDIS_PASSWORD → Container-Shell expandiert aus env
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  minio:
    image: minio/minio:latest
    container_name: coremail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9001:9001"   # MinIO Web-Konsole
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [coremail]

  # ── Observability (--profile observability) ───────────────────────────────────

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: coremail-otel
    restart: unless-stopped
    profiles: [observability]
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ../observability/otel-collector/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [coremail]

  prometheus:
    image: prom/prometheus:latest
    container_name: coremail-prometheus
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [coremail]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: coremail-alertmanager
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks: [coremail]

  grafana:
    image: grafana/grafana:latest
    container_name: coremail-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [coremail]

  tempo:
    image: grafana/tempo:latest
    container_name: coremail-tempo
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo
    expose: ["3200", "4317"]
    networks: [coremail]

  loki:
    image: grafana/loki:latest
    container_name: coremail-loki
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/tmp/loki
    expose: ["3100"]
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  redisdata:
  miniodata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  tempo-data:
  loki-data:

networks:
  coremail:
    driver: bridge
