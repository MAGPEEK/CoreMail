name: coremail

# ═════════════════════════════════════════════════════════════════════════════
#  CoreMail 5.8.0 — Docker Compose (Produktion, 1 Host)
#
#  Inbetriebnahme in 3 Schritten:
#
#    1. Konfiguration anlegen (im Repo-Root):
#         bash scripts/setup.sh            # erzeugt .env mit zufälligen Schlüsseln
#       oder von Hand:
#         cp .env.example .env             # und die 5 CHANGE-ME-Werte ersetzen
#
#    2. Stack starten:
#         docker compose -f infra/docker/docker-compose.yml up -d
#       Beim ersten Start legt CoreMail das Datenbankschema an (ca. 60–90 s).
#
#    3. Einrichten im Browser:
#         http://<server-ip>:3000/bcp/     → Setup-Assistent: Admin-Konto + Domain
#       Danach im BCP unter SSL/TLS ein Zertifikat (Let's Encrypt) holen — ab dann
#       ist https://mail.<domain>/ erreichbar. Alternativ per CLI:
#         docker exec -it coremail coremail cert letsencrypt \
#           --domains mail.example.de --email admin@example.de --services SMTP,IMAP,POP3
#
#  Was in der .env stehen MUSS (alles andere hat sinnvolle Defaults):
#    POSTGRES_PASSWORD, REDIS_PASSWORD, MINIO_ROOT_PASSWORD  — Datenbank-Passwörter
#    JWT_SECRET, PEPPER                                       — je 64 Hex-Zeichen (openssl rand -hex 32)
#
#  Ports am Host (Firewall/Router freigeben):
#    25  SMTP Empfang (Pflicht für eingehende Mail)   143/993  IMAP / IMAPS
#    587 SMTP Submission (Mail-Clients, STARTTLS)     110/995  POP3 / POP3S (optional)
#    465 SMTPS (implizites TLS)                       80       HTTP → Let's-Encrypt-Challenge + Redirect
#    443 HTTPS (Webmail, Admin-Panel, JMAP, EWS, ActiveSync, CalDAV, Autodiscover)
#    3000 HTTP ohne TLS — für die Ersteinrichtung und hinter einem eigenen Reverse-Proxy
#
#  Container: coremail (alle Dienste) · postgres · redis · minio · rspamd · clamav
#  Alle Daten liegen in benannten Docker-Volumes (siehe unten) → Backup = Volumes sichern.
# ═════════════════════════════════════════════════════════════════════════════

services:

  # ───────────────────────────────────────────────────────────────────────────
  #  coremail — die Anwendung (SMTP/IMAP/POP3/JMAP/EWS/ActiveSync/CalDAV,
  #  REST-API, Webmail „MWA", Admin-Panel „BCP", Admin-CLI `coremail`)
  # ───────────────────────────────────────────────────────────────────────────
  coremail:
    image: magpeek/coremail-app:${COREMAIL_VERSION:-5.8.0}
    # Eigenen Build statt Docker-Hub-Image verwenden:
    # build:
    #   context: ../..
    #   dockerfile: infra/docker/Dockerfile.app
    container_name: coremail
    restart: unless-stopped
    environment:
      # ── Pflicht: Schlüssel aus .env (Start bricht mit Hinweis ab, wenn leer) ──
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env  →  openssl rand -hex 32}
      PEPPER:     ${PEPPER:?PEPPER fehlt in .env  →  openssl rand -hex 32}

      # ── Datenbanken (Hostnamen = Container-Namen in diesem Compose) ──────────
      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@postgres:5432/coremail
      REDIS_URL:    redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}@redis:6379
      MINIO_ENDPOINT:   minio
      MINIO_PORT:       "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD fehlt in .env}
      MINIO_BUCKET:     mail-attachments
      # Backups landen im selben MinIO (Bucket coremail-backups)
      S3_ENDPOINT:   http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      # ── Spam- und Virenschutz (Container unten) ──────────────────────────────
      RSPAMD_URL:  http://rspamd:11334
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      # ── Betrieb ──────────────────────────────────────────────────────────────
      NODE_ENV:  production
      LOG_LEVEL: ${LOG_LEVEL:-info}            # error | warn | info | debug
      TZ:        ${TZ:-Europe/Berlin}
      # Interner Dienst im selben Container — nicht ändern
      SECURITY_FILTER_URL: http://localhost:3002

      # ── Zeitpläne (Cron, UTC) ────────────────────────────────────────────────
      BACKUP_SCHEDULE:       ${BACKUP_SCHEDULE:-0 2 * * *}   # tägliches Vollbackup
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      RETENTION_SCHEDULE:    ${RETENTION_SCHEDULE:-0 3 * * *} # Aufbewahrungsrichtlinien

      # ── Optional: Browser-Push für Webmail (npx web-push generate-vapid-keys) ─
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:admin@example.com}

      # ── Optional: anderer HTTPS-Port, wenn 443 am Host belegt ist ────────────
      # HTTPS_PORT: "8443"     # dann unten auch "8443:8443" mappen

    ports:
      - "25:25"       # SMTP Empfang (Server → Server)
      - "465:465"     # SMTPS (implizites TLS)
      - "587:587"     # SMTP Submission (Mail-Clients, STARTTLS)
      - "143:143"     # IMAP (STARTTLS)
      - "993:993"     # IMAPS (implizites TLS)
      - "110:110"     # POP3 (STARTTLS)         — kann entfernt werden, wenn kein POP3 gewünscht
      - "995:995"     # POP3S (implizites TLS)  — dito
      - "80:3000"     # HTTP: Let's-Encrypt-Challenge (HTTP-01) + Weiterleitung auf HTTPS
      - "443:443"     # HTTPS: integrierter TLS-Proxy (Zertifikat im BCP → SSL/TLS)
      - "3000:3000"   # HTTP ohne TLS: Ersteinrichtung; hinter eigenem Reverse-Proxy (Traefik,
                      # Caddy, nginx, Synology) → nur diesen Port nutzen, 80/443 oben entfernen
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      rspamd:   { condition: service_started }
      clamav:   { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Ressourcen-Obergrenze (gegen Lastspitzen); bei >100 Nutzern erhöhen
    deploy:
      resources:
        limits:
          cpus: '${COREMAIL_CPU_LIMIT:-2}'
          memory: ${COREMAIL_MEM_LIMIT:-2g}
    networks: [coremail]

  # ───────────────────────────────────────────────────────────────────────────
  #  Infrastruktur — Standard-Images, keine Anpassung nötig
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       coremail
      POSTGRES_USER:     coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [coremail]

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [coremail]

  minio:
    # Objektspeicher für Anhänge, Roh-Mails, Quarantäne und Backups
    image: minio/minio:latest
    container_name: coremail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO-Konsole nur lokal (ssh -L 9001:localhost:9001 <server>)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [coremail]

  rspamd:
    # Spamfilter (Bayes, DKIM/SPF/DMARC-Auswertung, Fuzzy, URL-Listen)
    image: rspamd/rspamd:4.0.0
    container_name: coremail-rspamd
    restart: unless-stopped
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd-data:/var/lib/rspamd
    healthcheck:
      test: ["CMD-SHELL", "rspamc symbols /dev/null > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [coremail]

  clamav:
    # Virenscanner; lädt beim ersten Start die Signaturen (~300 MB, einige Minuten)
    image: clamav/clamav:stable
    container_name: coremail-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"   # tägliche Signatur-Updates
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────
#  Daten — diese Volumes sichern (docker run --rm -v coremail_pgdata:/d alpine tar …)
#    pgdata      PostgreSQL: Nutzer, Ordner, Mail-Metadaten, Einstellungen
#    miniodata   MinIO: Mail-Inhalte, Anhänge, Backups
#    redisdata   Redis: Sitzungen, Warteschlangen (verzichtbar)
#    rspamd-data Bayes-Lerndaten        clamav-data Virensignaturen (werden neu geladen)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  redisdata:
  miniodata:
  rspamd-data:
  clamav-data:

networks:
  coremail:
    driver: bridge
