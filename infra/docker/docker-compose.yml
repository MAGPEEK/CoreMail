name: coremail

# ─────────────────────────────────────────────────────────────────────────────
# CoreMail v0.9.0 — 2-Container-Setup
#
# Schnellstart:
#   cp .env.example .env        # Passwörter und Hostname anpassen
#   bash scripts/gen-dev-certs.sh  # TLS-Zertifikat generieren (Entwicklung)
#   docker compose up -d
#
# Mit Observability:
#   docker compose --profile observability up -d
#
# Voraussetzungen:
#   • TLS-Zertifikat unter infra/docker/nginx/certs/
#     (fullchain.pem + privkey.pem)
#   • .env-Datei mit gesetzten Passwörtern
#
# Container:
#   coremail-app  → magpeek/coremail-app:0.9.0
#                   (alle Node.js-Services + nginx + Frontends)
#   coremail-db   → magpeek/coremail-db:0.9.0
#                   (PostgreSQL 16 + Redis 7 + MinIO)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  coremail-db — Datenbank-Container                                        ║
  # ║  PostgreSQL 16 + Redis 7 + MinIO                                          ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝

  coremail-db:
    image: magpeek/coremail-db:0.9.0
    # Lokaler Build (zum Entwickeln/Testen):
    # build:
    #   context: ../..
    #   dockerfile: infra/docker/Dockerfile.db
    container_name: coremail-db
    restart: unless-stopped
    environment:
      # PostgreSQL
      POSTGRES_DB: coremail
      POSTGRES_USER: coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MinIO
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - redisdata:/data/redis
      - miniodata:/data/minio
    ports:
      - "9001:9001"   # MinIO Web Console (optional, kann entfernt werden)
    expose:
      - "5432"   # PostgreSQL (nur intern)
      - "6379"   # Redis (nur intern)
      - "9000"   # MinIO S3 API (nur intern)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail && redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [coremail]

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  coremail-app — Hauptanwendung                                            ║
  # ║  Alle Node.js-Services + nginx Reverse Proxy + OWA/ECP Frontends          ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝

  coremail-app:
    image: magpeek/coremail-app:0.9.0
    # Lokaler Build (zum Entwickeln/Testen):
    # build:
    #   context: ../..
    #   dockerfile: infra/docker/Dockerfile.app
    container_name: coremail-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # ── Datenbank (zeigt auf coremail-db) ─────────────────────────────────
      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD}@coremail-db:5432/coremail
      REDIS_URL: redis://:${REDIS_PASSWORD}@coremail-db:6379
      MINIO_ENDPOINT: coremail-db
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: mail-attachments

      # ── Sicherheit ────────────────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET}
      PEPPER: ${PEPPER}

      # ── Mailserver-Hostname ────────────────────────────────────────────────
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      SMTP_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      IMAP_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}

      # ── Interne Service-URLs (localhost, gleicher Container) ───────────────
      STORAGE_API_URL: http://localhost:3001
      AUTH_SERVICE_URL: http://localhost:3003
      SECURITY_FILTER_URL: http://localhost:3002
      EWS_SERVICE_URL: http://localhost:8080

      # ── Service-Ports ──────────────────────────────────────────────────────
      STORAGE_PORT: "3001"
      AUTH_PORT: "3003"
      SECURITY_FILTER_PORT: "3002"
      API_PORT: "3000"
      EWS_PORT: "8080"
      AUTODISCOVER_PORT: "8081"
      CALDAV_PORT: "8082"
      BACKUP_PORT: "3004"
      EAS_PORT: "3005"
      POP3_PORT: "110"
      POP3S_PORT: "995"

      # ── URLs (für EWS Autodiscover) ────────────────────────────────────────
      EWS_URL: https://${MAIL_HOSTNAME:-mail.example.com}/EWS/Exchange.asmx
      OWA_URL: https://${MAIL_HOSTNAME:-mail.example.com}/owa/
      AUTODISCOVER_BASE: https://${MAIL_HOSTNAME:-mail.example.com}
      EAS_URL: https://${MAIL_HOSTNAME:-mail.example.com}/Microsoft-Server-ActiveSync

      # ── WebAuthn (für MFA) ─────────────────────────────────────────────────
      WEBAUTHN_RP_NAME: CoreMail
      WEBAUTHN_RP_ID: ${MAIL_HOSTNAME:-mail.example.com}
      WEBAUTHN_ORIGIN: https://${MAIL_HOSTNAME:-mail.example.com}

      # ── Backup ────────────────────────────────────────────────────────────
      S3_ENDPOINT: http://coremail-db:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: coremail-backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}

      # ── GeoIP (optional — für Country-Filtering) ───────────────────────────
      # MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      # MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
    ports:
      - "80:80"       # HTTP (Redirect zu HTTPS)
      - "443:443"     # HTTPS (OWA, ECP, API, EWS, Autodiscover)
      - "25:25"       # SMTP Inbound
      - "465:465"     # SMTPS (implizites TLS)
      - "587:587"     # Submission (STARTTLS)
      - "143:143"     # IMAP (STARTTLS)
      - "993:993"     # IMAPS (implizites TLS)
      - "110:110"     # POP3 (STARTTLS)
      - "995:995"     # POP3S (implizites TLS)
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro   # TLS-Zertifikate
    depends_on:
      coremail-db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [coremail]

  # ╔═══════════════════════════════════════════════════════════════════════════╗
  # ║  Observability Stack (--profile observability)                             ║
  # ╚═══════════════════════════════════════════════════════════════════════════╝

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: coremail-otel
    restart: unless-stopped
    profiles: [observability]
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ../observability/otel-collector/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks: [coremail]

  prometheus:
    image: prom/prometheus:latest
    container_name: coremail-prometheus
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [coremail]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: coremail-alertmanager
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks: [coremail]

  grafana:
    image: grafana/grafana:latest
    container_name: coremail-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${MAIL_HOSTNAME:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [coremail]

  tempo:
    image: grafana/tempo:latest
    container_name: coremail-tempo
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/tmp/tempo
    expose: ["3200", "4317"]
    networks: [coremail]

  loki:
    image: grafana/loki:latest
    container_name: coremail-loki
    restart: unless-stopped
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/tmp/loki
    expose: ["3100"]
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  redisdata:
  miniodata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  tempo-data:
  loki-data:

# ─────────────────────────────────────────────────────────────────────────────
# Netzwerk
# ─────────────────────────────────────────────────────────────────────────────

networks:
  coremail:
    driver: bridge
