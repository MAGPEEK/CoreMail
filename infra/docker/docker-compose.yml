name: coremail

# ═════════════════════════════════════════════════════════════════════════════
#  CoreMail 10.6.0 — Docker Compose, variant STANDARD (production, single host)
#
#  Variants (docs/docker-compose.md has the comparison table):
#    docker-compose.minimal.yml   MINIMAL   coremail + postgres + redis (1–50 users)
#    docker-compose.yml           STANDARD  ← this file: + minio, rspamd, clamav
#                                           (the file existing installations use)
#    docker-compose.full.yml      MAXIMAL   + limits, log rotation, optional
#                                           profiles minio / backup / geoip
#  All three use the same volume names — switching keeps the data.
#
#  Getting started — no .env needed (10.4, docs/setup.md "Automatic secrets"):
#
#    1. Start the stack (in the repo root):
#         docker compose -f infra/docker/docker-compose.yml up -d
#       The coremail container writes every secret into ./secrets/ next to
#       this file (infra/docker/secrets/) when it starts; the other containers
#       wait for their password file, then start. On first start CoreMail
#       creates the database schema (approx. 60–90 s).
#
#    2. Set up in the browser:
#         http://<server-ip>:3000/setup    → setup wizard: admin account + domain
#       The one-time setup token is in ./secrets/setup-token:
#         docker exec coremail cat /secrets/setup-token
#       Then obtain a certificate (Let's Encrypt) in the BCP under Certificates — from
#       then on https://mail.<domain>/ is reachable. Alternatively via CLI:
#         docker exec -it coremail coremail cert letsencrypt \
#           --domains mail.example.de --email admin@example.de --services SMTP,IMAP,POP3
#
#    3. BACK UP ./secrets/ off the server (coremail.env: without PEPPER no
#       password works, without JWT_SECRET + PEPPER no MFA login / backup opens).
#
#  .env stays optional and always wins: an installation with a .env (bash
#  scripts/setup.sh, or cp .env.example .env) keeps its values — the coremail
#  container copies them into ./secrets/ and only generates what is missing.
#  COREMAIL_SECRETS_PATH moves the secrets directory (default ./secrets).
#
#  Host ports (open in firewall/router):
#    25  SMTP inbound (required for incoming mail)   143/993  IMAP / IMAPS
#    587 SMTP submission (mail clients, STARTTLS)    110/995  POP3 / POP3S (optional)
#    465 SMTPS (implicit TLS)                        80       HTTP → Let's Encrypt challenge + redirect
#    443 HTTPS (webmail, admin panel, JMAP, ActiveSync, CalDAV, Autodiscover)
#    3000 HTTP without TLS — for initial setup and behind your own reverse proxy
#
#  Containers: coremail (all services) · postgres · redis · minio · rspamd · clamav
#  (updating from 10.4.0: `up -d --remove-orphans` removes its stopped init container once)
#  All data lives in named Docker volumes (see below) → backup = back up the volumes
#  (database dump first, then the volumes — docs/storage.md) and ./secrets/.
# ═════════════════════════════════════════════════════════════════════════════

services:

  # ───────────────────────────────────────────────────────────────────────────
  #  coremail — the application (SMTP/IMAP/POP3/JMAP/ActiveSync/CalDAV,
  #  REST API, webmail "MWA", admin panel "BCP", admin CLI `coremail`).
  #  Its entrypoint first creates ./secrets/coremail.env + the single-value
  #  password files (first start; later only missing keys, never overwritten —
  #  a value from .env is copied, not generated), then waits for PostgreSQL.
  # ───────────────────────────────────────────────────────────────────────────
  coremail:
    image: magpeek/coremail-app:${COREMAIL_VERSION:-10.6.0}
    # Use your own build instead of the Docker Hub image:
    # build:
    #   context: ../..
    #   dockerfile: infra/docker/Dockerfile.app
    container_name: coremail
    restart: unless-stopped
    environment:
      # ── Secrets: .env wins; empty = ./secrets/coremail.env (generated) ──────
      # 64 hex characters each (openssl rand -hex 32) when set by hand.
      JWT_SECRET: ${JWT_SECRET:-}
      PEPPER:     ${PEPPER:-}

      # ── Databases (hostnames = container names in this Compose file) ────────
      # Empty DATABASE_URL / REDIS_URL = built by the entrypoint exactly as this
      # file did before 10.4:
      #   postgresql://<COREMAIL_DB_USER|coremail>:<COREMAIL_DB_PASSWORD|POSTGRES_PASSWORD>@postgres:5432/coremail
      #   redis://:<REDIS_PASSWORD>@redis:6379
      # COREMAIL_DB_USER = a non-superuser role created on a FRESH database by
      # postgres/02-app-role.sh (scripts/setup.sh sets it). Unset = the superuser
      # "coremail" (switching: docs/deployment-security.md).
      DATABASE_URL:         ${DATABASE_URL:-}
      REDIS_URL:            ${REDIS_URL:-}
      POSTGRES_PASSWORD:    ${POSTGRES_PASSWORD:-}
      COREMAIL_DB_USER:     ${COREMAIL_DB_USER:-}
      COREMAIL_DB_PASSWORD: ${COREMAIL_DB_PASSWORD:-}
      REDIS_PASSWORD:       ${REDIS_PASSWORD:-}
      MINIO_ROOT_PASSWORD:  ${MINIO_ROOT_PASSWORD:-}
      # Secrets directory: names it in messages; the setup log hint names the
      # published HTTP port below (3000:3000).
      COREMAIL_SECRETS_HOST_PATH: ${COREMAIL_SECRETS_PATH:-./secrets}
      COREMAIL_PUBLIC_HTTP_PORT:  "3000"
      # Schema updates that would delete data stop the start (nothing is changed)
      # until this is "true" for ONE start — a pg_dump goes to /data/backups first.
      COREMAIL_ALLOW_SCHEMA_DATA_LOSS: ${COREMAIL_ALLOW_SCHEMA_DATA_LOSS:-false}

      # ── Backup encryption (AES-256-GCM, docs/deployment-security.md) ─────────
      # 64 hex characters (openssl rand -hex 32), generated by scripts/setup.sh.
      # KEEP A COPY OFF THIS SERVER — without it backups cannot be restored.
      # Empty = derived from JWT_SECRET + PEPPER (warning in the log).
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      # Password header for rspamd controller calls (learn_spam/ham, thresholds).
      RSPAMD_CONTROLLER_PASSWORD: ${RSPAMD_CONTROLLER_PASSWORD:-}

      # ── Object storage (docs/storage.md) ─────────────────────────────────────
      # Mail contents, attachments, quarantine. OBJECT_STORAGE unset = minio
      # (installations without that line keep working unchanged); new installations
      # (scripts/setup.sh) use "filesystem" = the coremail-data volume below.
      OBJECT_STORAGE: ${OBJECT_STORAGE:-minio}     # minio | s3 | filesystem
      STORAGE_PATH:   /data/objects                # filesystem driver (volume coremail-data)
      # minio / s3 driver — defaults = the bundled MinIO container; for external
      # S3 (AWS, Backblaze B2, Wasabi, Hetzner, Cloudflare R2) set these in .env.
      MINIO_ENDPOINT:   ${MINIO_ENDPOINT:-minio}
      MINIO_PORT:       ${MINIO_PORT:-}
      MINIO_USE_SSL:    ${MINIO_USE_SSL:-false}
      MINIO_REGION:     ${MINIO_REGION:-}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-}
      MINIO_CA_FILE:    ${MINIO_CA_FILE:-}       # PEM of a private CA (mount it read-only)
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      # Empty = MINIO_ROOT_PASSWORD from ./secrets/coremail.env (bundled MinIO only)
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-}}
      MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-coremail-attachments}
      # Backups go to the bundled MinIO (bucket coremail-backups) — with every
      # OBJECT_STORAGE driver, which is why the minio service stays in this file.
      S3_ENDPOINT:   http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}

      # ── Spam and virus protection (containers below) ─────────────────────────
      RSPAMD_URL:  http://rspamd:11334   # rspamd controller: scanning + Bayes learning + stats
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      # ── Operation ────────────────────────────────────────────────────────────
      NODE_ENV:  production
      LOG_LEVEL: ${LOG_LEVEL:-info}            # error | warn | info | debug
      TZ:        ${TZ:-Europe/Berlin}
      # TOTP secret encryption key (empty = derived from JWT_SECRET + PEPPER)
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      # WebAuthn relying party override (empty = publicHostname, https)
      WEBAUTHN_RP_ID:  ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      # Internal service in the same container — do not change
      SECURITY_FILTER_URL: http://localhost:3002
      # Smarthost with a self-signed certificate: "true" disables verification (not recommended)
      SMARTHOST_TLS_INSECURE: ${SMARTHOST_TLS_INSECURE:-false}

      # ── Schedules (cron, UTC) ────────────────────────────────────────────────
      BACKUP_SCHEDULE:       ${BACKUP_SCHEDULE:-0 2 * * *}   # default of "Empfohlene Sicherung einrichten" (BCP), docs/backup.md
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      RETENTION_SCHEDULE:    ${RETENTION_SCHEDULE:-0 3 * * *} # retention policies

      # ── Optional: browser push for webmail (npx web-push generate-vapid-keys) ─
      VAPID_PUBLIC_KEY:  ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT:     ${VAPID_SUBJECT:-mailto:admin@example.com}

      # ── Security ─────────────────────────────────────────────────────────────
      # Initial setup needs a one-time token: ./secrets/setup-token
      # (docker exec coremail cat /secrets/setup-token; or set SETUP_TOKEN in .env).
      # TRUST_PROXY: only when port 3000 is reachable
      # exclusively through your own reverse proxy (e.g. "1" or its CIDR) — default
      # off, otherwise clients could spoof their IP via X-Forwarded-For.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Branding defaults — BCP → Branding wins; docs/branding.md
      BRANDING_NAME:  ${BRANDING_NAME:-}
      BRANDING_COLOR: ${BRANDING_COLOR:-}

      # ── Optional tuning — set in .env; empty = built-in default ──────────────
      # Every variable is described in .env.example; details in docs/mail-security.md,
      # docs/mailbox-quotas-recovery.md, docs/mail-protocol-limits.md,
      # docs/api-gateway-security.md and docs/deployment-security.md.
      # Schema sync (pre-migration pg_dump)
      COREMAIL_SCHEMA_BACKUP:      ${COREMAIL_SCHEMA_BACKUP:-}
      COREMAIL_SCHEMA_BACKUP_DIR:  ${COREMAIL_SCHEMA_BACKUP_DIR:-}
      # Quotas, recoverable items, out-of-office
      DELETED_ITEM_RETENTION_DAYS: ${DELETED_ITEM_RETENTION_DAYS:-}
      QUOTA_FULL_PERMANENT:        ${QUOTA_FULL_PERMANENT:-}
      QUOTA_USAGE_CACHE_SEC:       ${QUOTA_USAGE_CACHE_SEC:-60}   # explicit default: an empty value would mean 0 (no cache)
      OOF_REPLY_MEMORY_DAYS:       ${OOF_REPLY_MEMORY_DAYS:-}
      # Global API rate limit (overrides BCP → Settings → Security when set)
      API_RATE_LIMIT_ENABLED:      ${API_RATE_LIMIT_ENABLED:-}
      API_RATE_LIMIT_WINDOW_MIN:   ${API_RATE_LIMIT_WINDOW_MIN:-}
      API_RATE_LIMIT_PER_USER:     ${API_RATE_LIMIT_PER_USER:-}
      API_RATE_LIMIT_PER_IP:       ${API_RATE_LIMIT_PER_IP:-}
      # Inbound filtering (LOCAL_SPOOF_* / ARC_TRUSTED_SEALERS override BCP → Protection → Spoofing when set)
      LOCAL_SPOOF_ACTION:          ${LOCAL_SPOOF_ACTION:-}
      LOCAL_SPOOF_ALLOW:           ${LOCAL_SPOOF_ALLOW:-}
      ARC_TRUSTED_SEALERS:         ${ARC_TRUSTED_SEALERS:-}
      SECURITY_FILTER_FAIL_OPEN:   ${SECURITY_FILTER_FAIL_OPEN:-}
      RULE_PATTERN_STEP_BUDGET:    ${RULE_PATTERN_STEP_BUDGET:-}
      RULE_PATTERN_MESSAGE_STEP_BUDGET: ${RULE_PATTERN_MESSAGE_STEP_BUDGET:-}
      DELETED_ITEM_PURGE_OBJECTS: ${DELETED_ITEM_PURGE_OBJECTS:-}
      DRAFT_WRITE_RATE_LIMIT: ${DRAFT_WRITE_RATE_LIMIT:-}
      DRAFT_WRITE_RATE_WINDOW_SEC: ${DRAFT_WRITE_RATE_WINDOW_SEC:-}
      # SMTP
      OUTBOUND_ALLOW_PRIVATE_MX:   ${OUTBOUND_ALLOW_PRIVATE_MX:-}
      OUTBOUND_DELAY_DSN_HOURS:    ${OUTBOUND_DELAY_DSN_HOURS:-}
      SMTP_TARPIT_MAX_DELAY_MS:    ${SMTP_TARPIT_MAX_DELAY_MS:-}
      SMTP_EXT_SMTPUTF8:           ${SMTP_EXT_SMTPUTF8:-}
      SMTP_EXT_DSN:                ${SMTP_EXT_DSN:-}
      SMTP_EXT_CHUNKING:           ${SMTP_EXT_CHUNKING:-}
      # Brute-force exemptions and connection limits
      MAIL_AUTH_EXEMPT_CIDRS:      ${MAIL_AUTH_EXEMPT_CIDRS:-}
      MAIL_CONN_EXEMPT_CIDRS:      ${MAIL_CONN_EXEMPT_CIDRS:-}
      IMAP_MAX_CONNS:              ${IMAP_MAX_CONNS:-}
      IMAP_MAX_CONNS_PER_IP:       ${IMAP_MAX_CONNS_PER_IP:-}
      IMAP_MAX_CONNS_PER_USER:     ${IMAP_MAX_CONNS_PER_USER:-}
      IMAP_SORT_MAX_MESSAGES:      ${IMAP_SORT_MAX_MESSAGES:-}
      POP3_MAX_CONNS:              ${POP3_MAX_CONNS:-}
      POP3_MAX_CONNS_PER_IP:       ${POP3_MAX_CONNS_PER_IP:-}
      JMAP_UPLOAD_QUOTA_MB:        ${JMAP_UPLOAD_QUOTA_MB:-}
      JMAP_UPLOAD_MAX_BLOBS:       ${JMAP_UPLOAD_MAX_BLOBS:-}
      AUTOCONFIG_RATE_LIMIT:       ${AUTOCONFIG_RATE_LIMIT:-}
      # Web / REST API
      COREMAIL_ALLOWED_ORIGINS:    ${COREMAIL_ALLOWED_ORIGINS:-}
      AUDIT_EXPORT_SIGNING_KEY:    ${AUDIT_EXPORT_SIGNING_KEY:-}
      HTTP_REDIRECT_HTTPS:         ${HTTP_REDIRECT_HTTPS:-}
      HTTPS_PUBLIC_PORT:           ${HTTPS_PUBLIC_PORT:-}
      MAIL_SEND_MAX_RECIPIENTS:    ${MAIL_SEND_MAX_RECIPIENTS:-}
      MAIL_SEND_RATE_LIMIT:        ${MAIL_SEND_RATE_LIMIT:-}
      MAIL_SEND_RATE_WINDOW_SEC:   ${MAIL_SEND_RATE_WINDOW_SEC:-}
      IMAGE_PROXY_RATE_LIMIT:      ${IMAGE_PROXY_RATE_LIMIT:-}
      IMAGE_PROXY_RATE_WINDOW_SEC: ${IMAGE_PROXY_RATE_WINDOW_SEC:-}
      BACKUP_IMPORT_MAX_BYTES:     ${BACKUP_IMPORT_MAX_BYTES:-}
      OIDC_TRUST_IDP_MFA_FOR_ADMINS: ${OIDC_TRUST_IDP_MFA_FOR_ADMINS:-}
      SMTP_HOSTNAME:                ${SMTP_HOSTNAME:-}
      POP3_HOSTNAME:                ${POP3_HOSTNAME:-}
      REFERENCES_BACKFILL:          ${REFERENCES_BACKFILL:-}
      REFERENCES_LAZY_BUDGET_MS:    ${REFERENCES_LAZY_BUDGET_MS:-}

      # ── Optional: different HTTPS port if 443 is already in use on the host ──
      # HTTPS_PORT: "8443"     # then also map "8443:8443" below

    ports:
      - "25:25"       # SMTP inbound (server → server)
      - "465:465"     # SMTPS (implicit TLS)
      - "587:587"     # SMTP submission (mail clients, STARTTLS)
      - "143:143"     # IMAP (STARTTLS)
      - "993:993"     # IMAPS (implicit TLS)
      - "110:110"     # POP3 (STARTTLS)         — can be removed if POP3 is not wanted
      - "995:995"     # POP3S (implicit TLS)    — same
      - "80:3000"     # HTTP: Let's Encrypt challenge (HTTP-01) + redirect to HTTPS
      - "443:443"     # HTTPS: integrated TLS proxy (certificate in BCP → Certificates)
      - "3000:3000"   # HTTP without TLS: initial setup; behind your own reverse proxy (Traefik,
                      # Caddy, nginx, Synology) → use only this port, remove 80/443 above
    volumes:
      # Persistent app data — /data/objects holds mail contents with
      # OBJECT_STORAGE=filesystem (unused but harmless with minio). The container
      # itself stays stateless: recreate it at will, the volume keeps the data.
      - coremail-data:/data
      # Secrets (coremail.env, setup-token) — back this directory up off the server
      - ${COREMAIL_SECRETS_PATH:-./secrets}:/secrets
    # service_started only: the other containers wait for the password files
    # this container writes, so waiting for them to be healthy here would
    # deadlock. coremail waits for PostgreSQL and Redis itself.
    depends_on:
      postgres: { condition: service_started }
      redis:    { condition: service_started }
      minio:    { condition: service_started }
      rspamd:   { condition: service_started }
      clamav:   { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    # Resource limits (against load spikes); increase for >100 users
    deploy:
      resources:
        limits:
          cpus: '${COREMAIL_CPU_LIMIT:-2}'
          memory: ${COREMAIL_MEM_LIMIT:-2g}
    # Hardening: no privilege escalation, only the capabilities the entrypoint
    # (root: chown/mkdir of the storage volume, pg_dump to /data/backups) and
    # supervisord (root: switches every service to user node, signals them)
    # need. The services themselves run as node without capabilities; binding
    # ports < 1024 works through the unprivileged-port sysctl below (the
    # setcap on the node binary does not apply with no-new-privileges).
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL, NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks:
      coremail: {}
      # Dedicated network to rspamd with a FIXED app address — the only
      # address the rspamd controller trusts without a password.
      rspamd:
        ipv4_address: ${RSPAMD_NET_PREFIX:-10.253.253}.2

  # ───────────────────────────────────────────────────────────────────────────
  #  Infrastructure — standard images, no customization needed. Passwords come
  #  from .env when set, else from the single-value files the coremail
  #  container writes (./secrets mounted read-only at /run/coremail). Each
  #  container waits for its file (at most 10 min, a log line every 10 s),
  #  then runs the image's own entrypoint unchanged.
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped
    # Waits for the password file the coremail container writes (unless .env
    # sets POSTGRES_PASSWORD), then runs the image entrypoint unchanged.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        w=0
        until [ -n "$${POSTGRES_PASSWORD}" ] || [ -s /run/coremail/postgres-password ]; do
          if [ "$$w" -ge 600 ]; then echo "postgres: /run/coremail/postgres-password still missing after $${w}s — is the coremail container running?" >&2; exit 1; fi
          if [ $$((w % 10)) -eq 0 ]; then echo "postgres: waiting for the coremail container to write /run/coremail/postgres-password ($${w}s)"; fi
          sleep 2; w=$$((w + 2))
        done
        [ -z "$${POSTGRES_PASSWORD}" ] || unset POSTGRES_PASSWORD_FILE
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB:       coremail
      POSTGRES_USER:     coremail
      # POSTGRES_PASSWORD from .env wins over the file the coremail container
      # writes. Read only when the data directory is created — an existing
      # database keeps its password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: /run/coremail/postgres-password
      # Non-superuser application role, created on a FRESH database only (02-app-role.sh)
      COREMAIL_DB_USER:     ${COREMAIL_DB_USER:-}
      COREMAIL_DB_PASSWORD: ${COREMAIL_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/02-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
      - ${COREMAIL_SECRETS_PATH:-./secrets}:/run/coremail:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [coremail]

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped
    # Password: REDIS_PASSWORD from .env, else ./secrets/redis-password. The
    # image entrypoint still switches to user redis.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        w=0
        until [ -n "$${REDIS_PASSWORD}" ] || [ -s /run/coremail/redis-password ]; do
          if [ "$$w" -ge 600 ]; then echo "redis: /run/coremail/redis-password still missing after $${w}s — is the coremail container running?" >&2; exit 1; fi
          if [ $$((w % 10)) -eq 0 ]; then echo "redis: waiting for the coremail container to write /run/coremail/redis-password ($${w}s)"; fi
          sleep 2; w=$$((w + 2))
        done
        REDIS_PASSWORD="$${REDIS_PASSWORD:-$$(cat /run/coremail/redis-password)}" || exit 1
        [ -n "$$REDIS_PASSWORD" ] || { echo "redis: no REDIS_PASSWORD and no /run/coremail/redis-password" >&2; exit 1; }
        exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
      - ${COREMAIL_SECRETS_PATH:-./secrets}:/run/coremail:ro
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD:-$$(cat /run/coremail/redis-password)}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [coremail]

  minio:
    # S3 object storage: backups (bucket coremail-backups) and — with
    # OBJECT_STORAGE=minio, the default when OBJECT_STORAGE is unset — mail
    # contents, attachments and quarantine. Filesystem installations that send
    # backups elsewhere (S3_ENDPOINT) or do not need them may remove this service
    # and the depends_on entry above (docs/storage.md).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372   # community build of MinIO (official images discontinued); pinned by digest
    container_name: coremail-minio
    restart: unless-stopped
    # Password: MINIO_ROOT_PASSWORD from .env, else ./secrets/minio-root-password
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        w=0
        until [ -n "$${MINIO_ROOT_PASSWORD}" ] || [ -s /run/coremail/minio-root-password ]; do
          if [ "$$w" -ge 600 ]; then echo "minio: /run/coremail/minio-root-password still missing after $${w}s — is the coremail container running?" >&2; exit 1; fi
          if [ $$((w % 10)) -eq 0 ]; then echo "minio: waiting for the coremail container to write /run/coremail/minio-root-password ($${w}s)"; fi
          sleep 2; w=$$((w + 2))
        done
        MINIO_ROOT_PASSWORD="$${MINIO_ROOT_PASSWORD:-$$(cat /run/coremail/minio-root-password)}" || exit 1
        export MINIO_ROOT_PASSWORD
        exec /usr/bin/docker-entrypoint.sh minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - miniodata:/data
      - ${COREMAIL_SECRETS_PATH:-./secrets}:/run/coremail:ro
    ports:
      - "127.0.0.1:9001:9001"   # MinIO console local only (ssh -L 9001:localhost:9001 <server>)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [coremail]

  rspamd:
    # Spam filter (Bayes, DKIM/SPF/DMARC evaluation, fuzzy, URL lists)
    image: rspamd/rspamd:4.0.0
    container_name: coremail-rspamd
    restart: unless-stopped
    # Started as root ONLY to read ./secrets/rspamd-controller-password (0600,
    # root) when RSPAMD_CONTROLLER_PASSWORD is empty; rspamd itself runs as
    # _rspamd (11333), the image's own user, as before.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        w=0
        until [ -n "$${RSPAMD_CONTROLLER_PASSWORD}" ] || [ -s /run/coremail/rspamd-controller-password ]; do
          if [ "$$w" -ge 600 ]; then echo "rspamd: /run/coremail/rspamd-controller-password still missing after $${w}s — is the coremail container running?" >&2; exit 1; fi
          if [ $$((w % 10)) -eq 0 ]; then echo "rspamd: waiting for the coremail container to write /run/coremail/rspamd-controller-password ($${w}s)"; fi
          sleep 2; w=$$((w + 2))
        done
        if [ -z "$${RSPAMD_CONTROLLER_PASSWORD}" ] && [ -f /run/coremail/rspamd-controller-password ]; then
          RSPAMD_CONTROLLER_PASSWORD="$$(cat /run/coremail/rspamd-controller-password)" || exit 1
          export RSPAMD_CONTROLLER_PASSWORD
        fi
        exec setpriv --reuid=11333 --regid=11333 --clear-groups /usr/bin/rspamd -f
    environment:
      # rspamd/local.d/worker-controller.inc: the controller trusts ONLY the app
      # container's fixed address without a password; everything else needs
      # RSPAMD_CONTROLLER_PASSWORD (web UI: ssh tunnel; .env or ./secrets).
      RSPAMD_CONTROLLER_SECURE_IP: ${RSPAMD_NET_PREFIX:-10.253.253}.2
      RSPAMD_CONTROLLER_PASSWORD:  ${RSPAMD_CONTROLLER_PASSWORD:-}
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd-data:/var/lib/rspamd
      - ${COREMAIL_SECRETS_PATH:-./secrets}:/run/coremail:ro
    healthcheck:
      test: ["CMD-SHELL", "rspamc symbols /dev/null > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Only on the dedicated network: reachable by the app container alone.
    # Fixed address too, so it never takes the app's .2 when it starts first.
    networks:
      rspamd:
        ipv4_address: ${RSPAMD_NET_PREFIX:-10.253.253}.3

  clamav:
    # Virus scanner; downloads the signatures on first start (~300 MB, a few minutes)
    image: clamav/clamav:stable
    container_name: coremail-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"   # daily signature updates
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────
#  Data — back up these volumes (docker run --rm -v coremail_pgdata:/d alpine tar …)
#    pgdata        PostgreSQL: users, folders, mail metadata, settings
#    coremail-data mail contents + attachments with OBJECT_STORAGE=filesystem (/data/objects)
#    miniodata     MinIO: backups; mail contents with OBJECT_STORAGE=minio
#    redisdata   Redis: sessions, queues (expendable)
#    rspamd-data Bayes training data    clamav-data virus signatures (re-downloaded)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata:
  coremail-data:
  redisdata:
  miniodata:
  rspamd-data:
  clamav-data:

networks:
  coremail:
    driver: bridge
  # app ↔ rspamd only. A fixed /29 so the app has a known address
  # (${RSPAMD_NET_PREFIX}.2). Change RSPAMD_NET_PREFIX in .env if
  # 10.253.253.0/29 collides with a network on your host or LAN.
  rspamd:
    driver: bridge
    ipam:
      config:
        - subnet: ${RSPAMD_NET_PREFIX:-10.253.253}.0/29
