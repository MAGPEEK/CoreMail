name: coremail

# ─────────────────────────────────────────────────────────────────────────────
# CoreMail v3.17.2
#
# Schnellstart:
#   cp .env.example .env           # Hostname und Passwörter anpassen
#   docker compose up -d           # Images von Docker Hub laden und starten
#
# Ports:
#   3000        — HTTP (MWA Webmail, BCP Admin, REST API, Autodiscover, EWS)
#   80          — HTTP für ACME HTTP-01 (Let's Encrypt)
#   443         — HTTPS integrierter TLS-Proxy (OPTIONAL — siehe unten)
#   25/465/587  — SMTP
#   143/993     — IMAP
#   110/995     — POP3
#   9001        — MinIO Web-Konsole (Dateiinspektion / Backup)
#

services:

  # ── CoreMail Hauptanwendung ─────────────────────────────────────────────────
  # Enthält: alle Node.js-Services + OWA/ECP-Frontends (supervisord)
  # Kein nginx — api-gateway übernimmt HTTP-Routing auf Port 3000

  coremail:
    image: magpeek/coremail-app:3.17.38
    # Lokaler Build:
    # build:
    #   context: ../..
    #   dockerfile: infra/docker/Dockerfile.app
    container_name: coremail
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Datenbank
      DATABASE_URL: postgresql://coremail:${POSTGRES_PASSWORD}@postgres:5432/coremail
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: mail-attachments

      # Sicherheitsschlüssel
      JWT_SECRET: ${JWT_SECRET}
      PEPPER: ${PEPPER}

      # Interne Service-URLs (localhost, gleicher Container)
      STORAGE_API_URL: http://localhost:3001
      AUTH_SERVICE_URL: http://localhost:3003
      SECURITY_FILTER_URL: http://localhost:3002
      EWS_SERVICE_URL: http://localhost:8080
      EAS_SERVICE_URL: http://localhost:3005
      CALDAV_SERVICE_URL: http://localhost:8082

      # Externe Sicherheits-Container
      RSPAMD_URL: http://rspamd:11334
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      # Service-Ports
      API_PORT: "3000"
      STORAGE_PORT: "3001"
      SECURITY_FILTER_PORT: "3002"
      AUTH_PORT: "3003"
      BACKUP_PORT: "3004"
      EAS_PORT: "3005"
      EWS_PORT: "8080"
      AUTODISCOVER_PORT: "8081"
      CALDAV_PORT: "8082"

      # WebAuthn (für MFA, optional)
      # WEBAUTHN_RP_ID und WEBAUTHN_ORIGIN werden aus ServerSettings.publicHostname gelesen
      WEBAUTHN_RP_NAME: CoreMail

      # Backup
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_BUCKET: coremail-backups
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}

      # Statische Dateien (OWA/ECP Frontends im Container)
      WWW_DIR: /app/www

      # VAPID Web Push
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@coremail.local}


      # Aufbewahrungsrichtlinien-Zeitplan
      RETENTION_SCHEDULE: ${RETENTION_SCHEDULE:-0 3 * * *}


    ports:
      - "3000:3000"   # HTTP — MWA, BCP, API, Auth, EWS, Autodiscover
      - "80:3000"     # HTTP Port 80 — ACME HTTP-01 Challenge (Let's Encrypt)
      # HTTPS — integrierter TLS-Proxy
      - "443:443"
      - "25:25"       # SMTP Inbound
      - "465:465"     # SMTPS (implizites TLS)
      - "587:587"     # Submission (STARTTLS)
      - "143:143"     # IMAP (STARTTLS)
      - "993:993"     # IMAPS (implizites TLS)
      - "110:110"     # POP3 (STARTTLS)
      - "995:995"     # POP3S (implizites TLS)
    # ── Ressourcenlimits (DoS-Schutz) ─────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: '${COREMAIL_CPU_LIMIT:-2}'
          memory: ${COREMAIL_MEM_LIMIT:-2g}
    # Standalone (ohne Swarm): docker update --memory 2g --cpus 2 coremail
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      rspamd:   { condition: service_started }
      clamav:   { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [coremail]

  # ── Rspamd 4.0 — Anti-Spam ──────────────────────────────────────────────────
  # Offizielles Rspamd-Image, Controller-API auf Port 11334
  # Konfiguration: infra/docker/rspamd/local.d/

  rspamd:
    image: rspamd/rspamd:4.0.0
    container_name: coremail-rspamd
    restart: unless-stopped
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd-data:/var/lib/rspamd
    expose:
      - "11333"   # Worker (SMTP-Filter)
      - "11334"   # Controller (Web-API)
    healthcheck:
      test: ["CMD-SHELL", "rspamc symbols /dev/null > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [coremail]

  # ── ClamAV — Open-Source Antivirus ──────────────────────────────────────────
  # Offizielles ClamAV-Image (GPL), inkl. freshclam für Signatur-Updates
  # Protokoll: INSTREAM über TCP Port 3310

  clamav:
    image: clamav/clamav:stable
    container_name: coremail-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"   # freshclam für tägliche Signatur-Updates aktivieren
    volumes:
      - clamav-data:/var/lib/clamav
    expose:
      - "3310"    # clamd INSTREAM
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s   # Erstes Signatur-Update kann länger dauern
    networks: [coremail]

  # ── Infrastruktur (Standard-Images) ─────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: coremail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coremail
      POSTGRES_USER: coremail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coremail -d coremail"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  redis:
    image: redis:7-alpine
    container_name: coremail-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [coremail]

  minio:
    image: minio/minio:latest
    container_name: coremail-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"   # MinIO Web-Konsole — NUR localhost (kein WAN-Zugriff!)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [coremail]

# ─────────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  redisdata:
  miniodata:
  rspamd-data:
  clamav-data:

networks:
  coremail:
    driver: bridge
