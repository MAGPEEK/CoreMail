# CoreMail Helm Chart — Default Values

global:
  image:
    registry: ghcr.io/magpeek/coremail
    tag: "0.6.0"
    pullPolicy: IfNotPresent
  domain: "mail.example.com"
  # TLS secret created by cert-manager
  tlsSecretName: "coremail-tls"

# ── Secrets ─────────────────────────────────────────────────────────────────
secrets:
  # Name of a pre-existing Kubernetes Secret (or use secretRef below)
  existingSecret: ""
  # If existingSecret is empty, chart creates a Secret from these values.
  # DO NOT commit real values — use --set or a sealed-secrets file.
  jwtSecret: "changeme-jwt-secret"
  postgresPassword: "changeme-postgres"
  minioRootPassword: "changeme-minio"
  smtpRelayPassword: ""

# ── PostgreSQL (CloudNativePG) ───────────────────────────────────────────────
cnpg:
  enabled: true
  name: coremail-pg
  instances: 3
  image: ghcr.io/cloudnative-pg/postgresql:16
  storageClass: ""          # leave empty for cluster default
  storageSize: "50Gi"
  database: mailserver
  owner: ms
  backup:
    enabled: false          # set true + configure destinationPath for WAL archiving
    destinationPath: ""
    s3Credentials: {}

# ── Redis (Bitnami subchart) ─────────────────────────────────────────────────
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: false
  master:
    persistence:
      size: 8Gi
  replica:
    replicaCount: 2
    persistence:
      size: 8Gi

# ── MinIO ────────────────────────────────────────────────────────────────────
minio:
  enabled: true
  replicas: 4
  storageClass: ""
  storageSize: "100Gi"
  rootUser: minioadmin
  # rootPassword comes from secret

# ── Ingress / TLS ────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

# ── Default resource requests/limits (overridable per service) ───────────────
defaultResources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# ── HPA defaults ─────────────────────────────────────────────────────────────
defaultHpa:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ── Per-service overrides ────────────────────────────────────────────────────
services:
  smtpServer:
    enabled: true
    image: smtp-server
    port: 25
    extraPorts:
      - name: submission-tls
        containerPort: 465
      - name: submission
        containerPort: 587
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 8
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

  imapServer:
    enabled: true
    image: imap-server
    port: 143
    extraPorts:
      - name: imaps
        containerPort: 993
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 10

  pop3Server:
    enabled: true
    image: pop3-server
    port: 110
    extraPorts:
      - name: pop3s
        containerPort: 995
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 6

  ewsServer:
    enabled: true
    image: ews-server
    port: 8080
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 10
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

  apiGateway:
    enabled: true
    image: api-gateway
    port: 3000
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 10
    resources:
      requests:
        cpu: "150m"
        memory: "192Mi"
      limits:
        cpu: "750m"
        memory: "768Mi"

  autodiscover:
    enabled: true
    image: autodiscover
    port: 8081
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 4

  caldavServer:
    enabled: true
    image: caldav-server
    port: 8082
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 6

  webClient:
    enabled: true
    image: web-client
    port: 80
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 6

  adminPanel:
    enabled: true
    image: admin-panel
    port: 80
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 4

  backupService:
    enabled: true
    image: backup-service
    port: 3004
    replicaCount: 1          # backup jobs should not run in parallel
    hpa:
      minReplicas: 1
      maxReplicas: 2

  securityFilter:
    enabled: true
    image: security-filter
    port: 3005
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 8

  authService:
    enabled: true
    image: auth-service
    port: 3003
    replicaCount: 2
    hpa:
      minReplicas: 2
      maxReplicas: 8
