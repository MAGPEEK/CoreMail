{{- if .Values.ingress.enabled }}
{{- $i := .Values.ingress }}
{{- $hosts := prepend $i.extraHosts $i.host }}
{{- $tlsSecret := $i.tls.secretName | default (printf "%s-tls" (include "coremail.fullname" .)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "coremail.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "app") | nindent 4 }}
  {{- if or $i.annotations $i.certManager.enabled }}
  annotations:
    {{- with $i.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $i.certManager.enabled }}
    {{- if eq $i.certManager.issuerKind "Issuer" }}
    cert-manager.io/issuer: {{ $i.certManager.issuer | quote }}
    {{- else }}
    cert-manager.io/cluster-issuer: {{ $i.certManager.issuer | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $i.tls.enabled }}
  tls:
    - secretName: {{ $tlsSecret }}
      hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
