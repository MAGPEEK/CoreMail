{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "coremail.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.global.domain }}
      secretName: {{ .Values.global.tlsSecretName }}
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          # Webmail (OWA)
          - path: /owa
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-web-client
                port:
                  name: http
          # Admin panel (BCP)
          - path: /bcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-admin-panel
                port:
                  name: http
          # EWS
          - path: /EWS
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-ews-server
                port:
                  name: http
          # MAPI over HTTP
          - path: /mapi
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-ews-server
                port:
                  name: http
          # OAB
          - path: /OAB
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-ews-server
                port:
                  name: http
          # Autodiscover v1
          - path: /Autodiscover
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-autodiscover
                port:
                  name: http
          # Autodiscover v2
          - path: /autodiscover
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-autodiscover
                port:
                  name: http
          # REST API
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-api-gateway
                port:
                  name: http
          # CalDAV / CardDAV
          - path: /dav
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-caldav-server
                port:
                  name: http
          # Well-known
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-caldav-server
                port:
                  name: http
          # Root → redirect to OWA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "coremail.fullname" . }}-web-client
                port:
                  name: http
{{- end }}
