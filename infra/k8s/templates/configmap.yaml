{{- $a := .Values.app }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coremail.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "app") | nindent 4 }}
data:
  NODE_ENV: production
  LOG_LEVEL: {{ $a.logLevel | quote }}
  TZ: {{ $a.timezone | quote }}

  # All services run in the same container/pod and talk over loopback.
  # Do not change: the chart publishes no internal ports between pods.
  INTERNAL_BIND_HOST: 127.0.0.1
  SECURITY_FILTER_URL: http://localhost:3002

  TRUST_PROXY: {{ include "coremail.trustProxy" . | quote }}

  # Object storage (attachments, raw mail, quarantine) and backups.
  # OBJECT_STORAGE/MINIO_USE_SSL/MINIO_REGION/MINIO_CA_FILE/STORAGE_PATH: CoreMail >= 8.0.0
  {{- $os := .Values.objectStorage }}
  OBJECT_STORAGE: {{ $os.driver | quote }}
  {{- if eq $os.driver "filesystem" }}
  STORAGE_PATH: {{ $os.filesystem.path | quote }}
  {{- end }}
  {{- $minioHost := include "coremail.minio.host" . }}
  {{- if $minioHost }}
  MINIO_ENDPOINT: {{ $minioHost | quote }}
  MINIO_PORT: {{ include "coremail.minio.port" . | quote }}
  MINIO_USE_SSL: {{ $os.useSSL | toString | quote }}
  {{- with $os.region }}
  MINIO_REGION: {{ . | quote }}
  S3_REGION: {{ . | quote }}
  {{- end }}
  {{- if or $os.caFile.configMap $os.caFile.secret }}
  MINIO_CA_FILE: {{ printf "/etc/coremail/storage-ca/%s" $os.caFile.key | quote }}
  {{- end }}
  MINIO_BUCKET_ATTACHMENTS: {{ .Values.minio.bucket | quote }}
  S3_ENDPOINT: {{ printf "%s://%s:%s" (ternary "https" "http" $os.useSSL) $minioHost (include "coremail.minio.port" .) | quote }}
  BACKUP_BUCKET: {{ .Values.minio.backupBucket | quote }}
  {{- end }}

  # Spam and virus protection
  # RSPAMD_URL = rspamd controller: scanning (/checkv2), learning and stats (CoreMail >= 8.0.0)
  {{- $rspamd := include "coremail.rspamd.host" . }}
  {{- if and (not .Values.rspamd.enabled) .Values.rspamd.external.url }}
  RSPAMD_URL: {{ .Values.rspamd.external.url | quote }}
  {{- else if $rspamd }}
  RSPAMD_URL: {{ printf "http://%s:%s" $rspamd (ternary "11334" (toString .Values.rspamd.external.controllerPort) .Values.rspamd.enabled) | quote }}
  {{- end }}
  {{- $clamav := include "coremail.clamav.host" . }}
  {{- if $clamav }}
  CLAMAV_HOST: {{ $clamav | quote }}
  CLAMAV_PORT: {{ ternary "3310" (toString .Values.clamav.external.port) .Values.clamav.enabled | quote }}
  {{- end }}

  # Schedules (cron, UTC)
  BACKUP_SCHEDULE: {{ $a.backup.schedule | quote }}
  BACKUP_RETENTION_DAYS: {{ $a.backup.retentionDays | quote }}
  RETENTION_SCHEDULE: {{ $a.retentionSchedule | quote }}

  {{- with $a.publicUrl }}
  COREMAIL_PUBLIC_URL: {{ . | quote }}
  {{- end }}
  {{- with $a.webauthn.rpId }}
  WEBAUTHN_RP_ID: {{ . | quote }}
  {{- end }}
  {{- with $a.webauthn.origin }}
  WEBAUTHN_ORIGIN: {{ . | quote }}
  {{- end }}
  {{- with $a.vapid.publicKey }}
  VAPID_PUBLIC_KEY: {{ . | quote }}
  {{- end }}
  VAPID_SUBJECT: {{ $a.vapid.subject | quote }}
  {{- if $a.ldapAllowInsecure }}
  LDAP_ALLOW_INSECURE: "true"
  {{- end }}
  {{- with $a.jmapCorsOrigins }}
  JMAP_CORS_ORIGINS: {{ . | quote }}
  {{- end }}

  # Brute-force protection (empty = app defaults)
  {{- $m := $a.mailAuth }}
  {{- range $key, $env := dict "ipMaxFailures" "MAIL_AUTH_IP_MAX_FAILURES" "ipWindowSec" "MAIL_AUTH_IP_WINDOW_SEC" "ipLockSec" "MAIL_AUTH_IP_LOCK_SEC" "accountMaxFailures" "MAIL_AUTH_ACCOUNT_MAX_FAILURES" "accountWindowSec" "MAIL_AUTH_ACCOUNT_WINDOW_SEC" "accountLockSec" "MAIL_AUTH_ACCOUNT_LOCK_SEC" }}
  {{- with (index $m $key) }}
  {{ $env }}: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if $m.limitPrivateIps }}
  MAIL_AUTH_LIMIT_PRIVATE_IPS: "true"
  {{- end }}

  # Prisma CLI (schema sync): no update checks / telemetry
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
