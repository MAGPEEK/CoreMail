{{/* ── HTTP services (ews, api-gateway, autodiscover, caldav, auth, backup, security) */}}
{{- $httpServices := list
  (dict "key" "ewsServer"       "name" "ews-server"       "port" 8080 "health" "/health")
  (dict "key" "apiGateway"      "name" "api-gateway"      "port" 3000 "health" "/health")
  (dict "key" "autodiscover"    "name" "autodiscover"      "port" 8081 "health" "/health")
  (dict "key" "caldavServer"    "name" "caldav-server"     "port" 8082 "health" "/health")
  (dict "key" "authService"     "name" "auth-service"      "port" 3003 "health" "/health")
  (dict "key" "backupService"   "name" "backup-service"    "port" 3004 "health" "/health")
  (dict "key" "securityFilter"  "name" "security-filter"   "port" 3005 "health" "/health")
-}}

{{- range $httpServices }}
{{- $svcKey := .key }}
{{- $svcName := .name }}
{{- $svcPort := .port }}
{{- $healthPath := .health }}
{{- $svc := index $root.Values.services $svcKey }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "coremail.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svcName }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svcName }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: {{ $svcName }}
          image: {{ include "coremail.image" (dict "svc" $svc "root" $root) }}
          imagePullPolicy: {{ $root.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svcPort }}
            - name: metrics
              containerPort: 9464
          {{- include "coremail.envFrom" (dict "root" $root) | nindent 10 }}
          resources:
            {{- toYaml (default $root.Values.defaultResources $svc.resources) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ $healthPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "coremail.labels" $root | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $svcName }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: {{ $svcPort }}
      targetPort: http
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-{{ $svcName }}
  minReplicas: {{ default $root.Values.defaultHpa.minReplicas $svc.hpa.minReplicas }}
  maxReplicas: {{ default $root.Values.defaultHpa.maxReplicas $svc.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.defaultHpa.targetCPUUtilizationPercentage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svcName }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
{{- end }}
{{- end }}

{{/* ── Static frontends (web-client, admin-panel) ─────────────────────── */}}
{{- $frontends := list
  (dict "key" "webClient"   "name" "web-client"   "port" 80)
  (dict "key" "adminPanel"  "name" "admin-panel"   "port" 80)
-}}

{{- range $frontends }}
{{- $svcKey := .key }}
{{- $svcName := .name }}
{{- $svc := index $root.Values.services $svcKey }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "coremail.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $svcName }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svcName }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $svcName }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      containers:
        - name: {{ $svcName }}
          image: {{ include "coremail.image" (dict "svc" $svc "root" $root) }}
          imagePullPolicy: {{ $root.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml (default $root.Values.defaultResources $svc.resources) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "coremail.labels" $root | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $svcName }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-{{ $svcName }}
  minReplicas: {{ default $root.Values.defaultHpa.minReplicas $svc.hpa.minReplicas }}
  maxReplicas: {{ default $root.Values.defaultHpa.maxReplicas $svc.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.defaultHpa.targetCPUUtilizationPercentage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svcName }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
{{- end }}
{{- end }}
