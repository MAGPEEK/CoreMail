{{/*
Generic deployment + service + HPA + PDB for each CoreMail service.
Each entry in .Values.services maps to one Deployment.
*/}}

{{- define "coremail.envFrom" -}}
envFrom:
  - configMapRef:
      name: {{ include "coremail.fullname" .root }}-config
  - secretRef:
      name: {{ include "coremail.secretName" .root }}
{{- end }}

{{- $root := . -}}
{{- $fullname := include "coremail.fullname" . -}}

{{/* ── smtp-server ─────────────────────────────────────────────────────── */}}
{{- with .Values.services.smtpServer }}
{{- if .enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-smtp-server
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "coremail.labels" $root | nindent 4 }}
    app.kubernetes.io/component: smtp-server
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: smtp-server
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smtp-server
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      containers:
        - name: smtp-server
          image: {{ include "coremail.image" (dict "svc" . "root" $root) }}
          imagePullPolicy: {{ $root.Values.global.image.pullPolicy }}
          ports:
            - name: smtp
              containerPort: {{ .port }}
            {{- range .extraPorts }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
            {{- end }}
          {{- include "coremail.envFrom" (dict "root" $root) | nindent 10 }}
          resources:
            {{- toYaml (default $root.Values.defaultResources .resources) | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: {{ .port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-smtp-server
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "coremail.labels" $root | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: smtp-server
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: smtp
      port: 25
      targetPort: 25
    - name: submission-tls
      port: 465
      targetPort: 465
    - name: submission
      port: 587
      targetPort: 587
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-smtp-server
  namespace: {{ $root.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullname }}-smtp-server
  minReplicas: {{ default $root.Values.defaultHpa.minReplicas .hpa.minReplicas }}
  maxReplicas: {{ default $root.Values.defaultHpa.maxReplicas .hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $root.Values.defaultHpa.targetCPUUtilizationPercentage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-smtp-server
  namespace: {{ $root.Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smtp-server
      app.kubernetes.io/instance: {{ $root.Release.Name }}
{{- end }}
{{- end }}

