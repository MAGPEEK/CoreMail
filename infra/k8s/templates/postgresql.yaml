{{- if .Values.postgresql.enabled }}
{{- $p := .Values.postgresql }}
{{- $name := include "coremail.componentName" (dict "root" . "component" "postgresql") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
data:
  # Same as infra/docker/postgres/init.sql — runs once on an empty data directory
  01-init.sql: |
    {{- .Files.Get "files/postgres-init.sql" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "coremail.selectorLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  ports:
    - { name: postgresql, port: 5432, targetPort: postgresql, protocol: TCP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "postgresql") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "coremail.selectorLabels" (dict "root" . "component" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coremail.labels" (dict "root" . "component" "postgresql") | nindent 8 }}
      annotations:
        checksum/init: {{ .Files.Get "files/postgres-init.sql" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      containers:
        - name: postgresql
          image: {{ include "coremail.image" (dict "image" $p.image "default" "16-alpine") }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          ports:
            - { name: postgresql, containerPort: 5432, protocol: TCP }
          env:
            - name: POSTGRES_DB
              value: {{ $p.database | quote }}
            - name: POSTGRES_USER
              value: {{ $p.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "coremail.secretName" . }}, key: POSTGRES_PASSWORD } }
            # Subdirectory: a fresh volume may contain lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $p.username | quote }}, "-d", {{ $p.database | quote }}] }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $p.username | quote }}, "-d", {{ $p.database | quote }}] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ $p.username | quote }}, "-d", {{ $p.database | quote }}] }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: init
          configMap:
            name: {{ $name }}-init
        - name: run
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        {{- if not $p.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $p.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "coremail.selectorLabels" (dict "root" . "component" "postgresql") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $p.persistence.accessModes | nindent 10 }}
        {{- with $p.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.persistence.size }}
  {{- end }}
{{- end }}
