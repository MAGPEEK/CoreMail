{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.image }}

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
      secret:
        name: {{ include "coremail.fullname" . }}-pg-credentials

  storage:
    size: {{ .Values.cnpg.storageSize }}
    {{- if .Values.cnpg.storageClass }}
    storageClass: {{ .Values.cnpg.storageClass }}
    {{- end }}

  # 2 read replicas available for read traffic
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      work_mem: "4MB"

  monitoring:
    enablePodMonitor: true

  {{- if .Values.cnpg.backup.enabled }}
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: {{ .Values.cnpg.backup.destinationPath | quote }}
      s3Credentials:
        {{- toYaml .Values.cnpg.backup.s3Credentials | nindent 8 }}
      wal:
        compression: gzip
      data:
        compression: gzip
  {{- end }}
---
# Secret for CloudNativePG bootstrap credentials
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coremail.fullname" . }}-pg-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.cnpg.owner }}
  password: {{ .Values.secrets.postgresPassword | quote }}
{{- end }}
