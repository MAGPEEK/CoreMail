{{- if .Values.minio.enabled }}
{{- $m := .Values.minio }}
{{- $name := include "coremail.componentName" (dict "root" . "component" "minio") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "coremail.selectorLabels" (dict "root" . "component" "minio") | nindent 4 }}
  # S3 API only. Console (9001): kubectl port-forward pod/<name>-0 9001
  ports:
    - { name: s3, port: 9000, targetPort: s3, protocol: TCP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "coremail.selectorLabels" (dict "root" . "component" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coremail.labels" (dict "root" . "component" "minio") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $m.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: {{ include "coremail.image" (dict "image" $m.image "default" "latest") }}
          imagePullPolicy: {{ $m.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { name: s3, containerPort: 9000, protocol: TCP }
            - { name: console, containerPort: 9001, protocol: TCP }
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: {{ include "coremail.secretName" . }}, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "coremail.secretName" . }}, key: MINIO_ROOT_PASSWORD } }
            - name: MINIO_BROWSER_REDIRECT
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        {{- if not $m.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $m.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "coremail.selectorLabels" (dict "root" . "component" "minio") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $m.persistence.accessModes | nindent 10 }}
        {{- with $m.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $m.persistence.size }}
  {{- end }}
{{- end }}
