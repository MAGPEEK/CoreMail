{{- include "coremail.validate" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coremail.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "app") | nindent 4 }}
  annotations:
    # Chart 3.4: empty secrets.* values are generated once and kept on upgrade
    # (lookup). `helm uninstall` keeps this Secret, like the data volumes it
    # belongs to — a reinstall with the same release name reuses it. Delete it
    # by hand together with the PVCs.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  JWT_SECRET: {{ $s.jwtSecret | quote }}
  PEPPER: {{ $s.pepper | quote }}
  POSTGRES_PASSWORD: {{ $s.postgresPassword | quote }}
  REDIS_PASSWORD: {{ $s.redisPassword | quote }}
  {{- if include "coremail.minio.host" . }}
  MINIO_ROOT_USER: {{ $s.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $s.minioRootPassword | quote }}
  {{- end }}
  {{- with $s.mfaEncryptionKey }}
  MFA_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.setupToken }}
  SETUP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with $s.backupEncryptionKey }}
  BACKUP_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.rspamdControllerPassword }}
  RSPAMD_CONTROLLER_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $s.vapidPrivateKey }}
  VAPID_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
