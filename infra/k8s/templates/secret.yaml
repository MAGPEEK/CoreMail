{{- include "coremail.validate" . }}
{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coremail.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" (dict "root" . "component" "app") | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ $s.jwtSecret | quote }}
  PEPPER: {{ $s.pepper | quote }}
  POSTGRES_PASSWORD: {{ $s.postgresPassword | quote }}
  REDIS_PASSWORD: {{ $s.redisPassword | quote }}
  {{- if include "coremail.minio.host" . }}
  MINIO_ROOT_USER: {{ $s.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ $s.minioRootPassword | quote }}
  {{- end }}
  {{- with $s.mfaEncryptionKey }}
  MFA_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.setupToken }}
  SETUP_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with $s.vapidPrivateKey }}
  VAPID_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
