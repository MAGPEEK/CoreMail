{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coremail.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coremail.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  SMTP_RELAY_PASSWORD: {{ .Values.secrets.smtpRelayPassword | quote }}
{{- end }}
