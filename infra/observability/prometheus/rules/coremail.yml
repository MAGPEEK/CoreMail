groups:
  - name: coremail.mail
    interval: 30s
    rules:
      # Dead-letter queue has items
      - alert: SmtpDeadLetterQueueNotEmpty
        expr: coremail_queue_depth{queue="dead"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SMTP Dead-Letter-Queue nicht leer"
          description: "{{ $value }} Nachrichten in der Dead-Letter-Queue. Manuelle Prüfung erforderlich."

      # High spam rate
      - alert: HighSpamRate
        expr: |
          rate(coremail_messages_rejected_total{reason="spam"}[10m]) /
          rate(coremail_messages_processed_total[10m]) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Hohe Spam-Rate erkannt"
          description: "Spam-Rate liegt bei {{ $value | humanizePercentage }} in den letzten 10 Minuten."

      # Virus detected
      - alert: VirusDetected
        expr: increase(coremail_messages_rejected_total{reason="virus"}[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Virenbefall in eingehenden E-Mails"
          description: "{{ $value }} virenverseuchte Nachrichten in den letzten 5 Minuten erkannt."

  - name: coremail.auth
    interval: 60s
    rules:
      # High auth failure rate (brute force detection)
      - alert: HighAuthFailureRate
        expr: |
          rate(coremail_auth_failures_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Hohe Authentifizierungsfehlerate"
          description: "{{ $value }} Auth-Fehler/Sekunde auf {{ $labels.service }}. Möglicher Brute-Force-Angriff."

  - name: coremail.storage
    interval: 60s
    rules:
      # Storage quota warning (> 90%)
      - alert: StorageQuotaHigh
        expr: |
          coremail_storage_used_bytes / on() group_left()
          sum(coremail_storage_used_bytes) > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Speicherquota fast erschöpft"
          description: "Speicherauslastung liegt bei {{ $value | humanizePercentage }}."

  - name: coremail.services
    interval: 30s
    rules:
      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CoreMail-Dienst ausgefallen"
          description: "{{ $labels.job }} ist nicht erreichbar."

      # High HTTP error rate
      - alert: HighHttpErrorRate
        expr: |
          rate(coremail_http_requests_total{status=~"5.."}[5m]) /
          rate(coremail_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hohe HTTP-Fehlerrate"
          description: "{{ $value | humanizePercentage }} HTTP-5xx-Fehler auf {{ $labels.service }}."

      # Slow HTTP responses
      - alert: SlowHttpResponses
        expr: |
          histogram_quantile(0.95, rate(coremail_http_request_duration_ms_bucket[5m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Langsame HTTP-Antwortzeiten"
          description: "P95-Latenz liegt bei {{ $value }}ms auf {{ $labels.service }}."
