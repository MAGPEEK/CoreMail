global:
  smtp_smarthost: 'smtp-server:587'
  smtp_from: 'alerts@${MAIL_HOSTNAME:-mail.example.com}'
  smtp_require_tls: true

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: admin-email

  routes:
    - match:
        severity: critical
      receiver: admin-email
      continue: true

    - match:
        severity: warning
      receiver: admin-email
      group_wait: 5m

receivers:
  - name: admin-email
    email_configs:
      - to: '${ALERT_EMAIL:-admin@example.com}'
        send_resolved: true
        html: |
          {{ range .Alerts }}
          <b>{{ .Annotations.summary }}</b><br>
          {{ .Annotations.description }}<br>
          Severity: {{ .Labels.severity }}<br>
          Status: {{ .Status }}<br>
          <br>
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, service]
